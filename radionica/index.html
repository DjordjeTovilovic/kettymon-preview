<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KettyMon Radionica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap">
<style>
:root {
  --ground: #FCFBF9;
  --plate: #F4F2EE;
  --ink: #030E28;
  --ink-soft: #3C4559;
  --peri: #B0C7FA;
  --peri-deep: #94B1F2;
  --sage: #CFE1BD;
  --green: #104B42;
  --lime: #D9F99D;
  --line: #E4E1DA;
  --serif: 'Literata', Georgia, serif;
  --sans: 'Golos Text', system-ui, sans-serif;
  --gutter: clamp(16px, 4vw, 56px);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html { scrollbar-color: #C9C5BC var(--ground); accent-color: var(--ink); caret-color: var(--ink); }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 16px; font-weight: 400; line-height: 1.55; letter-spacing: 0.005em; font-variant-numeric: tabular-nums; }
::selection { background: var(--peri); color: var(--ink); }
img { display: block; max-width: 100%; }
a { color: inherit; text-underline-offset: 0.2em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
main:focus { outline: none; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; font-optical-sizing: auto; margin: 0; line-height: 1.06; letter-spacing: -0.015em; text-wrap: balance; }
p { margin: 0; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 var(--gutter); }

.bar { position: sticky; top: 0; z-index: 20; background: var(--ground); border-bottom: 1px solid var(--line); }
.bar-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 68px; }
.nav { display: flex; gap: 2px; }
.nav a { text-decoration: none; padding: 10px 12px; font-size: 15px; font-weight: 500; border-radius: 4px; }
.nav a:hover { background: var(--plate); }
.wordmark { font-family: var(--serif); font-weight: 600; font-size: 28px; text-decoration: none; letter-spacing: -0.02em; display: inline-flex; flex-direction: column; align-items: center; line-height: 1; gap: 4px; }
.wordmark { --logo-gold: #957148; --logo-ink: #6E4F2C; }
.wordmark svg { display: block; height: 34px; width: auto; }
.logo-stack { display: block; width: 180px; --logo-gold: #C9A46E; --logo-ink: #DCC497; }
.logo-stack svg { display: block; width: 100%; height: auto; }
.tools { display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
.langs { display: flex; gap: 2px; font-size: 13px; }
.langs button { border: 0; background: none; min-height: 40px; padding: 0 8px; border-radius: 4px; cursor: pointer; font-weight: 500; color: var(--ink-soft); }
.langs button[aria-pressed="true"] { background: var(--peri); color: var(--ink); }
.langs button:disabled { opacity: 0.4; cursor: not-allowed; }
.icon-btn { position: relative; width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 4px; text-decoration: none; }
.icon-btn:hover { background: var(--plate); }
.cnt { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 4px; background: var(--peri); color: var(--ink); font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; }
.mnav { display: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 28px; border: 0; border-radius: 4px; background: var(--peri); color: var(--ink); font-size: 16px; font-weight: 500; text-decoration: none; cursor: pointer; transition: background .2s var(--ease), transform .2s var(--ease); }
.btn:hover { background: var(--peri-deep); }
.btn.dark { background: var(--ink); color: #fff; }
.btn.dark:hover { background: #1B2640; }
.lime { display: inline-block; background: var(--lime); color: var(--ink); font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 3px; }

/* Hero */
.hero { padding: clamp(28px, 3.4vw, 48px) 0 0; }
.hero-top { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: 32px; align-items: end; }
.hero h1 { font-size: clamp(40px, 5vw, 76px); font-weight: 400; }
.hero h1 em { font-style: italic; font-weight: 400; }
.hero .side p { font-size: 18px; color: var(--ink-soft); max-width: 34ch; }
.hero .side .btn { margin-top: 24px; }
.hero-photo { position: relative; margin-top: clamp(20px, 2.6vw, 36px); border-radius: 6px; overflow: hidden; aspect-ratio: 2 / 1; background: var(--plate); }
.hero-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; }
.hero-photo .note { position: absolute; display: block; text-decoration: none; left: 20px; bottom: 20px; background: var(--ground); border-radius: 6px; padding: 14px 18px; max-width: 300px; box-shadow: 0 12px 32px rgba(20, 20, 20, 0.14); font-size: 15px; }
.hero-photo .note b { font-family: var(--serif); font-weight: 600; font-size: 18px; display: block; margin-bottom: 2px; }

.sec { padding: clamp(64px, 8vw, 112px) 0 0; }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
.sec-head h2 { font-size: clamp(32px, 3.6vw, 52px); max-width: 18ch; }
.tabs { display: flex; gap: 4px; background: var(--plate); padding: 4px; border-radius: 6px; }
.tabs button { border: 0; background: none; min-height: 42px; padding: 0 16px; border-radius: 4px; font-weight: 500; cursor: pointer; color: var(--ink-soft); }
.tabs button[aria-pressed="true"] { background: var(--ground); color: var(--ink); box-shadow: 0 1px 3px rgba(20, 20, 20, 0.12); }
.note-row { margin: -16px 0 24px; display: flex; gap: 6px; align-items: center; color: var(--ink-soft); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px 20px; }
.prod { text-decoration: none; display: block; }
.prod-img { position: relative; aspect-ratio: 5 / 4; border-radius: 6px; overflow: hidden; background: var(--plate); }
.prod-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .9s var(--ease); }
.prod:hover .prod-img img { transform: scale(1.03); }
.prod-img .lime { position: absolute; top: 12px; right: 12px; }
.prod h3 { font-size: 26px; margin-top: 16px; }
.prod .meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 4px; color: var(--ink-soft); }
.prod .meta b { color: var(--ink); font-weight: 500; }

/* Anatomy */
.anatomy { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(28px, 5vw, 72px); align-items: center; }
.anat-img { position: relative; border-radius: 6px; overflow: hidden; aspect-ratio: 4 / 3; }
.anat-img img { width: 100%; height: 100%; object-fit: cover; }
.pin { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: var(--ground); color: var(--ink); display: grid; place-items: center; font-weight: 600; font-size: 14px; border: 2px solid var(--ink); box-shadow: 0 6px 18px rgba(20, 20, 20, 0.22); }
.anat-list { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 0; }
.anat-list li { display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 18px 0; border-top: 1px solid var(--line); }
.anat-list li span { width: 30px; height: 30px; border-radius: 50%; background: var(--peri); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
.anat-list b { display: block; font-family: var(--serif); font-size: 20px; font-weight: 600; }
.anat-list p { color: var(--ink-soft); }
.anatomy h2 { font-size: clamp(32px, 3.4vw, 48px); }

/* Testimonials */
.voices { background: var(--sage); margin-top: clamp(64px, 8vw, 112px); padding: clamp(56px, 7vw, 96px) 0; }
.voices h2 { font-size: clamp(32px, 3.4vw, 48px); text-align: center; }
.quotes { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 20px; margin-top: 40px; }
.quotes figure { margin: 0; background: var(--ground); border-radius: 6px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; min-height: 240px; }
.quotes blockquote { margin: 0; font-family: var(--serif); font-size: 22px; line-height: 1.3; }
.quotes figcaption { font-size: 14px; color: var(--ink-soft); }
.quotes .ph blockquote { color: #4E5B4A; font-style: italic; font-size: 18px; }
.quotes .feature { padding: clamp(28px, 4vw, 56px); }
.quotes .feature blockquote { font-size: clamp(28px, 3.2vw, 48px); line-height: 1.15; }
.quotes .ph { background: rgba(252, 251, 249, 0.55); border: 1.5px dashed #9DB58A; }

/* Steps + FAQ */
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.how div { border-top: 2px solid var(--ink); padding-top: 20px; }
.how svg { margin-bottom: 14px; }
.how b { display: block; font-family: var(--serif); font-size: 22px; font-weight: 600; }
.how p { margin-top: 6px; color: var(--ink-soft); max-width: 32ch; }
.faq { max-width: 860px; }
.faq details { border-top: 1px solid var(--line); }
.faq details:last-child { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; padding: 22px 0; display: flex; justify-content: space-between; gap: 16px; font-family: var(--serif); font-size: 21px; font-weight: 500; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary svg { flex: none; transition: transform .3s var(--ease); }
.faq details[open] summary svg { transform: rotate(45deg); }
.faq details p { padding: 0 0 22px; color: var(--ink-soft); max-width: 62ch; }

.foot { background: var(--green); color: #DDE8DA; margin-top: clamp(72px, 9vw, 128px); padding: 64px 0 28px; font-size: 15px; }
.foot-in { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 32px; }
.foot p.lead { margin-top: 12px; max-width: 36ch; }
.foot h4 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: #fff; }
.foot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.foot a { color: #DDE8DA; }
.foot .legal { margin-top: 44px; padding-top: 18px; border-top: 1px solid #2B6158; font-size: 13px; color: #B8CDB3; }

/* PDP */
.crumb { display: inline-flex; gap: 6px; align-items: center; min-height: 44px; margin-top: 12px; font-size: 14px; font-weight: 500; text-decoration: none; color: var(--ink-soft); }
.pdp { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(28px, 4.5vw, 72px); padding: 12px 0 clamp(56px, 7vw, 104px); }
.main-img { position: relative; aspect-ratio: 5 / 4; border-radius: 6px; overflow: hidden; background: var(--plate); }
.main-img img { width: 100%; height: 100%; object-fit: cover; }
.mine { position: absolute; right: 12px; bottom: 12px; margin: 0; display: flex; align-items: center; gap: 12px; max-width: calc(100% - 24px); padding: 8px 16px 8px 8px; border-radius: 6px; background: var(--ground); box-shadow: 0 12px 32px rgba(20, 20, 20, 0.14); }
.km-pair { position: relative; display: block; flex: none; width: var(--pair); height: var(--pair); }
.km-pair img { position: absolute; display: block; object-fit: cover; border-radius: 50%; }
.km-pair .km-shell { left: 0; top: 0; width: 80%; height: 80%; }
.km-pair .km-pad { right: 0; bottom: 0; width: 58%; height: 58%; box-shadow: 0 0 0 3px var(--ground); }
.mine .km-pair { --pair: 60px; }
.mine figcaption { display: grid; grid-template-columns: auto auto; gap: 2px 12px; align-items: baseline; font-size: 14px; line-height: 1.4; color: var(--ink); }
.mine figcaption span { font-size: 12px; color: var(--ink-soft); }
.thumbs { display: flex; gap: 10px; margin-top: 10px; }
.thumbs button { width: 88px; aspect-ratio: 1; padding: 0; border: 0; border-radius: 4px; overflow: hidden; cursor: pointer; opacity: 0.7; transition: opacity .2s var(--ease); }
.thumbs button[aria-current="true"] { opacity: 1; outline: 2px solid var(--ink); outline-offset: 2px; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.side { align-self: start; position: sticky; top: 92px; }
.side h1 { font-size: clamp(38px, 3.8vw, 56px); }
.side .sub { margin-top: 8px; color: var(--ink-soft); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.side .price { margin-top: 18px; font-size: 26px; font-weight: 500; }
.side .final { font-size: 13px; color: var(--ink-soft); }
.side .blurb { margin-top: 16px; max-width: 46ch; color: var(--ink-soft); }
.lbl { margin: 26px 0 10px; font-weight: 600; font-size: 15px; }
.lbl span { font-weight: 400; color: var(--ink-soft); }
.fabrics { display: flex; flex-wrap: wrap; gap: 8px; }
.fab { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 5px 16px 5px 5px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--ground); cursor: pointer; font-weight: 500; }
.fab img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
.fab[aria-pressed="true"] { border-color: var(--ink); background: #EEF3FF; }
.sizes { display: grid; gap: 8px; }
.sz { display: grid; grid-template-columns: 22px 44px 1fr auto; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-radius: 4px; border: 1.5px solid var(--line); background: var(--ground); cursor: pointer; text-align: left; }
.sz .r { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-soft); display: grid; place-items: center; }
.sz[aria-pressed="true"] { border-color: var(--ink); background: #EEF3FF; }
.sz[aria-pressed="true"] .r::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.sz b { font-weight: 600; }
.sz span { color: var(--ink-soft); font-size: 14px; }
.buy { display: flex; gap: 10px; margin-top: 24px; }
.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 4px; }
.qty button { width: 44px; height: 50px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.qty span { min-width: 20px; text-align: center; font-weight: 600; }
.buy .btn { flex: 1; white-space: nowrap; }
.cod-box { margin-top: 18px; background: var(--sage); border-radius: 6px; padding: 16px 18px; display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 15px; }
.cod-box b { font-weight: 600; }

/* Cart / checkout */
.page-title { font-size: clamp(40px, 4.4vw, 64px); padding: 36px 0 28px; }
.two-col { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: clamp(24px, 4vw, 56px); align-items: start; padding-bottom: 80px; }
.item { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 18px; padding: 18px 0; border-top: 1px solid var(--line); align-items: center; }
.item:last-child { border-bottom: 1px solid var(--line); }
.item img { width: 120px; height: 96px; border-radius: 4px; object-fit: cover; }
.item h3 { font-size: 22px; }
.item .meta { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }
.fabric-meta { display: flex; align-items: center; gap: 8px; }
.item .fabric-meta img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
.item .ctl { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
.item .qty button { height: 40px; width: 40px; }
.txt { border: 0; background: none; text-decoration: underline; font-size: 14px; cursor: pointer; padding: 8px 0; min-height: 40px; color: var(--ink-soft); }
.item .sum { font-weight: 600; }
.sumbox { background: var(--plate); border-radius: 6px; padding: 26px; position: sticky; top: 92px; }
.sumbox .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
.sumbox .total { margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 20px; font-weight: 600; }
.progress { margin: 8px 0 4px; height: 6px; background: var(--ground); border-radius: 6px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--green); transition: width .6s var(--ease); }
.muted { color: var(--ink-soft); font-size: 14px; }
.sumbox .btn { width: 100%; margin-top: 20px; }
.empty { background: var(--plate); border-radius: 6px; padding: 72px 24px; text-align: center; margin-bottom: 80px; }
.empty h2 { font-size: 32px; margin-bottom: 20px; }
.form { display: grid; gap: 16px; }
.form h2 { font-size: 26px; margin-top: 8px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.f { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
.f input, .f textarea { font: inherit; font-weight: 400; font-size: 16px; min-height: 52px; padding: 0 14px; border-radius: 4px; border: 1.5px solid #D5D1C8; background: #fff; color: var(--ink); }
.f textarea { padding: 12px 14px; min-height: 96px; resize: vertical; }
.f input:focus, .f textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(176, 199, 250, 0.6); }
.f small { font-weight: 400; color: var(--ink-soft); }
.f .err { display: none; color: #B3261E; font-weight: 500; }
.was-validated .f input:invalid { border-color: #B3261E; }
.was-validated .f input:invalid ~ .err { display: block; }
.done { max-width: 680px; margin: 0 auto; padding: clamp(64px, 10vw, 140px) 0; text-align: center; }
.done h1 { font-size: clamp(48px, 6vw, 84px); }
.done p { margin-top: 16px; font-size: 18px; color: var(--ink-soft); }
.done .how { margin-top: 48px; text-align: left; grid-template-columns: 1fr; gap: 16px; }
.done .btn { margin-top: 36px; }

@media (max-width: 1000px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .anatomy, .pdp, .two-col, .hero-top { grid-template-columns: 1fr; }
  .quotes { grid-template-columns: 1fr; }
  .side, .sumbox { position: static; }
}
@media (max-width: 760px) {
  .bar-in { grid-template-columns: 1fr auto; height: 60px; }
  .nav { display: none; }
  .tools .langs button:disabled { display: none; }
  .mnav { display: flex; scrollbar-width: none; gap: 4px; overflow-x: auto; padding: 0 var(--gutter) 10px; }
  .mnav a { flex: none; text-decoration: none; font-size: 14px; font-weight: 500; padding: 8px 12px; background: var(--plate); border-radius: 4px; }
  .hero-photo { aspect-ratio: 4 / 3; }
  .hero-photo { overflow: visible; }
  .hero-photo img { border-radius: 6px; }
  .mine .km-pair { --pair: 48px; }
  .mine figcaption { font-size: 13px; }
  .hero-photo .note { position: static; margin-top: 10px; max-width: none; box-shadow: none; border: 1px solid var(--line); }
  .grid { grid-template-columns: 1fr; gap: 32px; }
  .how { grid-template-columns: 1fr; }
  .foot-in { grid-template-columns: 1fr 1fr; }
  .foot-in > div:first-child { grid-column: 1 / -1; }
  .item { grid-template-columns: 96px minmax(0, 1fr); }
  .item img { width: 96px; height: 80px; }
  .item .sum { grid-column: 2; }
  .pair { grid-template-columns: 1fr; }
  .buy .btn .s { display: none; }
  .sz { grid-template-columns: 22px 36px 1fr auto; padding: 0 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
@media (max-width: 760px) { .wordmark svg { height: 26px; } }
</style>
</head>

<div id="app"></div>
<script src="logo.js"></script>
<script src="shop.js"></script>
<script>

  var I = {

    plus: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    minus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>',
    left: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
    phone: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h3l1.5 4-2 1.3a10 10 0 0 0 6.2 6.2l1.3-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.7a2 2 0 0 1 2-2.2Z"/></svg>',
    needle: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20 18.5 5.5a2 2 0 0 1 2.8 2.8L6.8 22.8"/><path d="M17 7l1.6 1.6"/><path d="M3 14c2-1 4-1 5 1s3 2 5 1"/></svg>',
    cash: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6.5" width="19" height="11" rx="1.5"/><circle cx="12" cy="12" r="2.6"/><path d="M5.5 9.5v5M18.5 9.5v5"/></svg>',
    cashS: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6.5" width="19" height="11" rx="1.5"/><circle cx="12" cy="12" r="2.6"/></svg>'
  };

  function langs(s) {
    return '<div class="langs" role="group" aria-label="Jezik"><button type="button" aria-pressed="true" title="Srpski">SR</button><button type="button" disabled title="U pripremi">EN</button><button type="button" disabled title="U pripremi">RU</button></div>';
  }

  function header(c) {
    return '<header class="bar"><div class="wrap bar-in"><nav class="nav" aria-label="Glavni meni"><a href="#/proizvodi" data-act="browse">Krevetići</a><a href="#/proizvodi" data-act="browse" data-coll="Poznato. Ali novo.">Kolekcija</a><a href="#/utisci">Vaši utisci</a><a href="#/pitanja">Pitanja</a></nav>' +
      '<a class="wordmark" href="#/" aria-label="KettyMon, početna">' + KM_LOGO.row + '</a><div class="tools">' + langs(c.state) + '<a class="icon-btn" href="#/korpa" aria-label="Korpa, ' + c.cart.count + ' proizvoda">' + I.bag + (c.cart.count ? '<span class="cnt">' + c.cart.count + '</span>' : '') + '</a></div></div>' +
      '<nav class="mnav" aria-label="Meni"><a href="#/proizvodi" data-act="browse">Krevetići</a><a href="#/proizvodi" data-act="browse" data-coll="Poznato. Ali novo.">Kolekcija</a><a href="#/utisci">Utisci</a><a href="#/pitanja">Pitanja</a></nav></header>';
  }

  function prod(p) {
    return '<a class="prod" href="#/p/' + p.id + '"><div class="prod-img"><img src="' + p.photos[0] + '" alt="' + p.kind + ' ' + p.name + '" loading="lazy">' + (p.collection ? '<span class="lime">' + p.collection + '</span>' : '') + '</div>' +
      '<h3>' + p.name + '</h3><p class="meta"><span>' + p.kind + ' · ' + p.sizeLabel + '</span><b>' + p.from + '</b></p></a>';
  }

  function home(c) {
    var s = c.state;
    var tabs = [['', 'Svi'], [c.collection, c.collection]].map(function (t) { return '<button type="button" data-act="coll" data-coll="' + t[0] + '" aria-pressed="' + (s.coll === t[0]) + '">' + t[1] + '</button>'; }).join('');
    var oblak = KM.find('oblak');
    return '<section class="hero"><div class="wrap"><div class="hero-top"><h1>Krevetić koji vaš ljubimac <em>neće hteti</em> da napusti.</h1>' +
      '<div class="side"><p>Šijemo ih ručno u Srbiji, u veličini i tkaninama koje izaberete. Plaćate tek kada vam paket stigne.</p><a class="btn" href="#/proizvodi">Pogledaj krevetiće</a></div></div>' +
      '<div class="hero-photo"><img src="img/room-wide-saluki.webp" alt="Pas leži u okruglom belom krevetiću kraj prozora" fetchpriority="high">' +
      '<a class="note" href="#/p/oblak"><b>' + oblak.name + '</b>' + oblak.kind + ' · ' + c.sizeLabel(oblak) + ' · od ' + KM.fmt(oblak.sizes[0].price) + '</a></div></div></section>' +
      '<section class="sec" id="proizvodi"><div class="wrap"><div class="sec-head"><h2>Krevetići za svaki kutak doma</h2><div class="tabs" role="group" aria-label="Kolekcija">' + tabs + '</div></div>' +
      (c.filterNote ? '<p class="note-row">' + c.filterNote + ' · <button type="button" class="txt" data-act="browse">Prikaži sve</button></p>' : '') +
      '<div class="grid">' + c.products.map(prod).join('') + '</div></div></section>' +
      '<section class="sec"><div class="wrap anatomy"><div class="anat-img"><img src="img/bed-bolster-plants.webp" alt="Krevetić Luna sa psom" loading="lazy">' +
      '<span class="pin" style="left:18%;top:62%">1</span><span class="pin" style="left:50%;top:84%">2</span><span class="pin" style="left:80%;top:56%">3</span></div>' +
      '<div><h2>Šta čini dobar krevetić</h2><ol class="anat-list">' +
      '<li><span>1</span><div><b>Spoljni deo sa visokim ivicama</b><p>Ljubimac na njih naslanja glavu i oseća se sigurno.</p></div></li>' +
      '<li><span>2</span><div><b>Debeo jastuk unutra</b><p>Dovoljno mekan za spavanje, dovoljno čvrst da ne propada pod težinom.</p></div></li>' +
      '<li><span>3</span><div><b>Dve tkanine po vašem izboru</b><p>Jednu birate za jastuk, drugu za spoljni deo, ili istu za oba. Cena zavisi samo od veličine.</p></div></li></ol></div></div></section>' +
      '<section class="voices" id="utisci"><div class="wrap"><h2>Šta kažu vlasnici</h2><div class="quotes">' +
      '<figure class="feature"><blockquote>„Šarko je od prvog dana spavao samo na svom KettyMon krevetiću. Sad ne može da ga namami ni kauč.“</blockquote><figcaption>Šarko, mešanac · primer utiska</figcaption></figure>' +
      '<figure class="ph"><blockquote>[Sledeći utisak sa Instagrama]</blockquote><figcaption>[Ime ljubimca]</figcaption></figure></div></div></section>' +
      '<section class="sec"><div class="wrap"><div class="sec-head"><h2>Kako izgleda kupovina</h2></div><div class="how">' +
      '<div>' + I.phone + '<b>Poručite i čekajte poziv</b><p>Bez registracije i bez kartice. Zovemo vas da potvrdimo porudžbinu.</p></div>' +
      '<div>' + I.needle + '<b>Šijemo i šaljemo</b><p>' + c.delivery + ', na adrese širom Srbije.</p></div>' +
      '<div>' + I.cash + '<b>Plaćate kuriru</b><p>Gotovinom, kada paket stigne. Ako ne odgovara, imate 14 dana za povrat.</p></div></div></div></section>' +
      '<section class="sec" id="pitanja"><div class="wrap"><div class="sec-head"><h2>Pitanja</h2></div><div class="faq">' +
      '<details><summary>Kako da izaberem veličinu? ' + I.plus + '</summary><p>Uz svaku veličinu piše za koliko kilograma je namenjena. Ako vaš ljubimac voli da se ispruži, uzmite jednu veličinu veću.</p></details>' +
      '<details><summary>Koliko košta dostava? ' + I.plus + '</summary><p>Dostava košta ' + c.fee + ', a za porudžbine od ' + c.freeFrom + ' je besplatna.</p></details>' +
      '<details><summary>Kako plaćam? ' + I.plus + '</summary><p>Pouzećem: gotovinom kuriru kada paket stigne. Pre slanja vas zovemo da potvrdimo porudžbinu.</p></details>' +
      '<details><summary>Mogu li da vratim krevetić? ' + I.plus + '</summary><p>Da, u roku od 14 dana od preuzimanja. Troškove povratne dostave plaćate vi.</p></details>' +
      '</div></div></section>';
  }

  function fabrics(part, label, cur, opts) {
    return '<p class="lbl">' + label + ' <span>· ' + cur.name + '</span></p><div class="fabrics" role="group" aria-label="Tkanina, ' + label.toLowerCase() + '">' + opts.map(function (f) { return '<button type="button" class="fab" data-act="' + part + '" data-fabric="' + f.id + '" aria-pressed="' + f.on + '"><img src="' + f.img + '" alt="">' + f.name + '</button>'; }).join('') + '</div>';
  }

  function product(c) {
    var v = c.pv, p = v.p, pk = v.pick, g = v.gallery[v.view];
    return '<div class="wrap"><a class="crumb" href="#/proizvodi">' + I.left + 'Svi krevetići</a><div class="pdp"><div><div class="main-img"><img src="' + g.src + '" alt="' + g.alt + '">' +
      '<figure class="mine" aria-live="polite">' + v.pair + '<figcaption><span>Jastuk</span>' + v.pad.name + '<span>Spoljni deo</span>' + v.shell.name + '</figcaption></figure></div>' +
      '<div class="thumbs">' + v.gallery.map(function (t, i) { return '<button type="button" data-act="view" data-view="' + i + '" aria-current="' + (i === v.view) + '" aria-label="Slika ' + (i + 1) + '"><img src="' + t.src + '" alt=""></button>'; }).join('') + '</div></div>' +
      '<div class="side"><h1>' + p.name + '</h1><p class="sub">' + p.kind + ' · ' + v.sizeLabel + (p.collection ? ' <span class="lime">Kolekcija ' + p.collection + '</span>' : '') + '</p>' +
      '<p class="price">' + v.price + '</p><p class="final">Cene su konačne. Cena zavisi samo od veličine.</p><p class="blurb">' + p.blurb + '</p>' +
      fabrics('pad', 'Jastuk', v.pad, v.padOptions) + fabrics('shell', 'Spoljni deo', v.shell, v.shellOptions) +
      '<p class="lbl">Veličina <span>· prema težini ljubimca</span></p><div class="sizes">' + p.sizes.map(function (z) { return '<button type="button" class="sz" data-act="size" data-size="' + z.id + '" aria-pressed="' + (z.id === v.size.id) + '"><i class="r"></i><b>' + z.id + '</b><span>' + z.dims + ' · ' + z.pet + '</span><b>' + KM.fmt(z.price) + '</b></button>'; }).join('') + '</div>' +
      '<div class="buy"><div class="qty"><button type="button" data-act="qty" data-d="-1" aria-label="Smanji količinu">' + I.minus + '</button><span aria-live="polite">' + pk.qty + '</span><button type="button" data-act="qty" data-d="1" aria-label="Povećaj količinu">' + I.plus + '</button></div><button type="button" class="btn" data-act="add">Dodaj u korpu<span class="s">&nbsp;· ' + v.addTotal + '</span></button></div>' +
      '<div class="cod-box">' + I.cashS + '<p><b>Plaćanje pouzećem.</b> Zovemo vas da potvrdimo porudžbinu, ' + c.delivery.toLowerCase() + ', a plaćate kuriru.</p></div></div></div></div>';
  }

  function sumbox(c, action) {
    var k = c.cart;
    return '<aside class="sumbox" aria-label="Pregled porudžbine"><div class="row"><span>Međuzbir</span><span>' + k.subtotal + '</span></div><div class="row"><span>Dostava</span><span>' + k.shipping + '</span></div>' +
      (k.freeLeft ? '<div class="progress" aria-hidden="true"><i style="width:' + k.freeProgress + '%"></i></div><p class="muted">Dodajte još ' + k.freeLeft + ' za besplatnu dostavu.</p>' : '') +
      '<div class="row total"><span>Ukupno</span><span>' + k.total + '</span></div><p class="muted">Cene su konačne. Plaćate kuriru.</p>' + action + '</aside>';
  }

  function cart(c) {
    var k = c.cart;
    if (k.empty) return '<div class="wrap"><h1 class="page-title">Korpa</h1><div class="empty"><h2>Korpa je prazna.</h2><a class="btn" href="#/proizvodi">Pogledaj krevetiće</a></div></div>';
    return '<div class="wrap"><h1 class="page-title">Korpa</h1><div class="two-col"><div>' + k.lines.map(function (l) {
      return '<div class="item"><img src="' + l.product.photos[0] + '" alt=""><div><h3>' + l.product.name + '</h3><p class="meta">' + l.product.kind + ' · ' + l.size.id + ', ' + l.size.dims + '</p><p class="meta fabric-meta"><img src="' + l.pad.img + '" alt=""><img src="' + l.shell.img + '" alt="">' + l.fabricText + '</p><div class="ctl"><div class="qty"><button type="button" data-act="line" data-i="' + l.index + '" data-d="-1" aria-label="Smanji količinu">' + I.minus + '</button><span>' + l.qty + '</span><button type="button" data-act="line" data-i="' + l.index + '" data-d="1" aria-label="Povećaj količinu">' + I.plus + '</button></div><button type="button" class="txt" data-act="remove" data-i="' + l.index + '">Ukloni</button></div></div><p class="sum">' + l.total + '</p></div>';
    }).join('') + '</div>' + sumbox(c, '<a class="btn" href="#/porucivanje">Završi kupovinu</a>') + '</div></div>';
  }

  function f(name, label, type, extra, help) {
    return '<label class="f">' + label + '<input name="' + name + '" type="' + type + '" required ' + (extra || '') + '>' + (help ? '<small>' + help + '</small>' : '') + '<small class="err">Popunite ovo polje.</small></label>';
  }

  function checkout(c) {
    return '<div class="wrap"><h1 class="page-title">Poručivanje</h1><div class="two-col"><form class="form" data-form="order" novalidate><h2>Gde da pošaljemo?</h2>' +
      '<div class="pair">' + f('ime', 'Ime', 'text', 'autocomplete="given-name"') + f('prezime', 'Prezime', 'text', 'autocomplete="family-name"') + '</div>' + f('ulica', 'Ulica i broj', 'text', 'autocomplete="street-address"') +
      '<div class="pair">' + f('grad', 'Grad', 'text', 'autocomplete="address-level2"') + f('postanski', 'Poštanski broj', 'text', 'inputmode="numeric" pattern="[0-9]{5}" autocomplete="postal-code"') + '</div>' +
      f('telefon', 'Telefon', 'tel', 'autocomplete="tel"', 'Zovemo vas da potvrdimo porudžbinu.') + f('email', 'Email', 'email', 'autocomplete="email"', 'Ovde stiže potvrda.') +
      '<label class="f">Napomena (opciono)<textarea name="napomena" rows="3"></textarea></label>' +
      '<div class="cod-box">' + I.cashS + '<p><b>Plaćanje pouzećem.</b> Gotovinom kuriru pri preuzimanju paketa.</p></div>' +
      '<button class="btn dark" type="submit">Poruči · ' + c.cart.total + '</button></form>' + sumbox(c, '') + '</div></div>';
  }

  function done(c) {
    var o = c.order || { number: 'KM-1042' };
    return '<div class="wrap"><div class="done"><h1>Hvala vam!</h1><p>Primili smo vašu porudžbinu <b>' + o.number + '</b>.</p><div class="how">' +
      '<div>' + I.phone + '<b>Uskoro vas zovemo</b><p>Zovemo vas' + (o.phone ? ' na ' + c.esc(o.phone) : '') + ' da potvrdimo porudžbinu.</p></div>' +
      '<div>' + I.needle + '<b>Šijemo i šaljemo</b><p>' + c.delivery + '.</p></div><div>' + I.cash + '<b>Plaćate kuriru</b><p>Gotovinom, kada paket stigne.</p></div></div><a class="btn" href="#/">Nazad na početnu</a></div></div>';
  }

  function footer(c) {
    return '<footer class="foot"><div class="wrap"><div class="foot-in"><div><span class="logo-stack">' + KM_LOGO.stack + '</span><p class="lead">Ručno šiveni krevetići za pse i mačke. Prototip: fotografije, nazivi modela i tkanina, cene, cena dostave i rok dostave su privremeni primeri.</p></div>' +
      '<div><h4>Kupovina</h4><ul><li><a href="#">Dostava i plaćanje</a></li><li><a href="#">Povrat u roku od 14 dana</a></li><li><a href="#">Uslovi kupovine</a></li><li><a href="#">Politika privatnosti</a></li></ul></div>' +
      '<div><h4>Kontakt</h4><ul><li>[Telefon]</li><li>[Email]</li><li><a href="https://www.instagram.com/ketty.mon/">Instagram</a> · <a href="#">Viber</a> · <a href="#">WhatsApp</a></li></ul></div></div>' +
      '<p class="legal">© KettyMon · Prodavac: ' + c.seller + ' · Nije u sistemu PDV-a · Cene su konačne.</p></div></footer>';
  }

  KM.mount({ header: header, footer: footer, home: home, product: product, cart: cart, checkout: checkout, done: done });
})();
</script>
</body>
</html>
