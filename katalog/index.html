<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KettyMon Katalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Didact+Gothic&family=Onest:wght@300;400;500;600&display=swap">
<style>
:root {
  --ground: #F2F2EF;
  --sand: #E3DCCF;
  --tile: #FFFFFF;
  --ink: #2F2F2F;
  --ink-soft: #5B5953;
  --slate: #5E5C61;
  --slate-deep: #47454A;
  --line: #DAD6CD;
  --focus: #2F2F2F;
  --display: 'Didact Gothic', 'Century Gothic', sans-serif;
  --text: 'Onest', system-ui, sans-serif;
  --gutter: clamp(16px, 4vw, 56px);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
html { scrollbar-color: #B9B4AA var(--ground); accent-color: var(--slate); caret-color: var(--ink); }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--text); font-weight: 300; font-size: 17px; line-height: 1.55; font-variant-numeric: tabular-nums; }
::selection { background: var(--sand); color: var(--ink); }
img { display: block; max-width: 100%; }
a { color: inherit; text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
main:focus { outline: none; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.08; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.wrap { max-width: 1360px; margin: 0 auto; padding: 0 var(--gutter); }

/* Header */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(242, 242, 239, 0.94); backdrop-filter: saturate(1.2) blur(10px); border-bottom: 1px solid transparent; transition: background .3s var(--ease), border-color .3s var(--ease); }
.bar.over { position: absolute; left: 0; right: 0; background: transparent; backdrop-filter: none; color: #fff; }
.bar-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 72px; gap: 16px; }
.wordmark { font-family: var(--display); font-size: 26px; text-decoration: none; letter-spacing: 0.01em; white-space: nowrap; line-height: 1; display: inline-flex; flex-direction: column; gap: 5px; }
.wordmark { --logo-gold: #957148; --logo-ink: #6E4F2C; }
.wordmark svg { display: block; height: 34px; width: auto; }
.logo-stack { display: block; width: 180px; --logo-gold: #C9A46E; --logo-ink: #DCC497; }
.logo-stack svg { display: block; width: 100%; height: auto; }
.nav { display: flex; gap: 4px; justify-content: center; }
.nav a { text-decoration: none; padding: 10px 14px; border-radius: 999px; font-size: 15px; font-weight: 400; transition: background .2s var(--ease); }
.nav a:hover { background: rgba(127, 120, 110, 0.14); }
.tools { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.langs { display: flex; gap: 2px; margin-right: 6px; }
.langs button { border: 0; background: none; padding: 8px 7px; min-height: 40px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; cursor: pointer; opacity: 0.78; border-radius: 999px; }
.langs button[aria-pressed="true"] { opacity: 1; text-decoration: underline; text-underline-offset: 5px; }
.langs button:disabled { cursor: not-allowed; opacity: 0.35; }
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; border: 0; background: none; cursor: pointer; text-decoration: none; }
.icon-btn:hover { background: rgba(127, 120, 110, 0.14); }
.badge { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--slate); color: #fff; font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; }
.bar.over .badge { background: #fff; color: var(--ink); }
.bar.over .wordmark { --logo-gold: #E6CC9C; --logo-ink: #F3E2BF; }
.menu-btn { display: none; }
.sheet { display: none; }

/* Hero */
.hero { position: relative; height: min(calc(100svh - 140px), 800px); min-height: 520px; color: #fff; overflow: hidden; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; transform: scale(1.04); animation: settle 1.6s var(--ease) forwards; }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20, 18, 15, 0.38) 0%, rgba(20, 18, 15, 0.04) 30%, rgba(20, 18, 15, 0.34) 48%, rgba(20, 18, 15, 0.84) 100%); }
@keyframes settle { to { transform: scale(1); } }
.hero-copy { position: absolute; z-index: 1; left: 0; right: 0; bottom: clamp(36px, 7vh, 80px); text-align: center; padding: 0 var(--gutter); }
.hero h1 { font-size: clamp(40px, 6.2vw, 88px); max-width: 15ch; margin: 0 auto; }
.hero p { text-shadow: 0 1px 12px rgba(20, 18, 15, 0.45); margin-top: 16px; font-size: clamp(16px, 1.4vw, 19px); font-weight: 400; }
.pet-pills { display: flex; justify-content: center; gap: 12px; margin-top: 28px; }
.pill { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 999px; border: 0; font-size: 17px; font-weight: 500; text-decoration: none; cursor: pointer; transition: transform .25s var(--ease), background .25s var(--ease); }
.pill:hover { transform: translateY(-1px); }
.pill.white { background: #fff; color: var(--ink); }
.pill.slate { background: var(--slate); color: #fff; }
.pill.slate:hover { background: var(--slate-deep); }
.pill.line { background: none; border: 1px solid currentColor; }
.pill svg { flex: none; }

/* Catalogue */
.cat { padding: clamp(40px, 5vw, 72px) 0 clamp(56px, 8vw, 104px); }
.cat-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 40px; }
.cat-head h2 { font-size: clamp(32px, 3.6vw, 52px); max-width: 16ch; }
.toggle { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--tile); gap: 2px; }
.toggle button { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; min-height: 44px; padding: 0 18px; border-radius: 999px; font-size: 14px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; color: var(--ink-soft); transition: background .25s var(--ease), color .25s var(--ease); }
.toggle button[aria-pressed="true"] { background: var(--slate); color: #fff; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 1.6vw, 24px); }
.tile { display: block; text-decoration: none; }
.tile-img { position: relative; aspect-ratio: 4 / 5; background: var(--tile); border-radius: 6px; overflow: hidden; }
.tile-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .9s var(--ease); }
.tile:hover .tile-img img { transform: scale(1.035); }
.new { position: absolute; top: 14px; left: 14px; background: var(--slate); color: #fff; font-size: 12px; font-weight: 500; padding: 4px 11px; border-radius: 999px; }
.tile h3 { font-family: var(--text); font-weight: 600; font-size: 21px; letter-spacing: -0.01em; margin-top: 16px; }
.tile .kind { font-size: 15px; color: var(--ink-soft); margin-top: 2px; }
.tile .from { font-size: 15px; font-weight: 400; margin-top: 2px; }
.filter-note { margin: -24px 0 24px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.empty-note { grid-column: 1 / -1; padding: 40px; text-align: center; background: var(--tile); border-radius: 6px; }

/* Collection story */
.story { position: relative; min-height: min(78vh, 760px); color: #fff; display: flex; align-items: center; overflow: hidden; }
.story > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; }
.story::before { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, rgba(24, 20, 16, 0.74) 0%, rgba(24, 20, 16, 0.66) 40%, rgba(24, 20, 16, 0.2) 62%, rgba(24, 20, 16, 0) 78%); }
.story .wrap { position: relative; z-index: 2; width: 100%; }
.story-copy { max-width: 440px; }
.story h2 { font-size: clamp(40px, 5vw, 72px); }
.story p { margin-top: 20px; font-size: 18px; font-weight: 400; color: #F3EEE6; }
.story .pill { margin-top: 32px; }

/* Materials */
.materials { background: var(--sand); padding: clamp(64px, 9vw, 128px) 0; }
.materials-in { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(32px, 6vw, 96px); align-items: center; }
.materials h2 { font-size: clamp(32px, 3.6vw, 52px); max-width: 12ch; }
.materials p.lead { margin-top: 20px; max-width: 42ch; font-size: 18px; color: #4A463F; }
.fabric-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(10px, 1.4vw, 20px); }
.fabric-row figure { margin: 0; }
.fabric-row img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 999px; }
.fabric-row figcaption { margin-top: 12px; font-size: 15px; font-weight: 400; text-align: center; }

/* Testimonial + service */
.service { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.service div { display: flex; gap: 14px; align-items: flex-start; padding: 28px 24px 28px 0; }
.service div + div { padding-left: 24px; border-left: 1px solid var(--line); }
.service b { display: block; font-weight: 500; }
.service span { display: block; font-size: 15px; color: var(--ink-soft); }

/* Footer */
.foot { background: var(--ink); color: #E9E6DF; margin-top: clamp(48px, 6vw, 80px); padding: 64px 0 32px; font-size: 15px; }
.foot-in { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 32px; }
.foot h4 { margin: 0 0 12px; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #BDB8AE; }
.foot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.foot a { color: #E9E6DF; }
.foot .legal { margin-top: 48px; padding-top: 20px; border-top: 1px solid #45433F; font-size: 13px; color: #BDB8AE; }
.foot .note { margin-top: 12px; max-width: 40ch; color: #BDB8AE; }

/* Product page */
.crumbs { padding: 20px 0 8px; font-size: 14px; color: var(--ink-soft); }
.crumbs a { text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.pdp { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(28px, 5vw, 80px); padding-bottom: clamp(56px, 8vw, 112px); }
.gal-main { position: relative; aspect-ratio: 1 / 1; background: var(--tile); border-radius: 8px; overflow: hidden; }
.gal-main img { width: 100%; height: 100%; object-fit: cover; animation: fade .5s var(--ease); }
@keyframes fade { from { opacity: 0.4; } to { opacity: 1; } }
.fchip { position: absolute; right: 16px; bottom: 16px; margin: 0; display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.95); padding: 8px 18px 8px 8px; border-radius: 14px; box-shadow: 0 6px 20px rgba(40, 36, 30, 0.14); max-width: calc(100% - 32px); }
.km-pair { position: relative; display: block; flex: none; width: var(--pair); height: var(--pair); }
.km-pair img { position: absolute; display: block; object-fit: cover; border-radius: 50%; }
.km-pair .km-shell { left: 0; top: 0; width: 80%; height: 80%; }
.km-pair .km-pad { right: 0; bottom: 0; width: 58%; height: 58%; box-shadow: 0 0 0 3px #FFFFFF; }
.fchip .km-pair { --pair: 60px; }
.fchip figcaption { display: grid; grid-template-columns: auto auto; gap: 2px 12px; align-items: baseline; font-size: 14px; line-height: 1.4; color: var(--ink); }
.fchip figcaption span { font-size: 12px; color: var(--ink-soft); }
.fabric-row figcaption small { display: block; margin-top: 2px; font-size: 14px; color: var(--ink-soft); }
.line .meta.fab { margin-top: 0; }
.thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.thumbs button { aspect-ratio: 1; padding: 0; border: 0; border-radius: 6px; overflow: hidden; background: var(--tile); cursor: pointer; box-shadow: inset 0 0 0 0 var(--ink); outline-offset: 2px; }
.thumbs button img { width: 100%; height: 100%; object-fit: cover; }
.thumbs button[aria-current="true"] { outline: 2px solid var(--ink); }
.buy { align-self: start; position: sticky; top: 96px; }
.buy h1 { font-family: var(--text); font-weight: 600; letter-spacing: -0.025em; font-size: clamp(36px, 3.6vw, 52px); }
.buy .sub { margin-top: 8px; color: var(--ink-soft); }
.price { margin-top: 20px; font-size: 26px; font-weight: 400; }
.final { font-size: 14px; color: var(--ink-soft); }
.buy .blurb { margin-top: 20px; max-width: 46ch; }
.opt { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
.opt-label { font-size: 15px; }
.opt-label b { font-weight: 500; }
.swatches { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.swatch { width: 52px; height: 52px; padding: 3px; border-radius: 50%; border: 1.5px solid transparent; background: none; cursor: pointer; transition: border-color .2s var(--ease); }
.swatch img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.sizes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.size { min-width: 60px; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid #C7C2B8; background: var(--tile); cursor: pointer; font-size: 16px; font-weight: 500; transition: background .2s var(--ease), color .2s var(--ease); }
.size[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.size-note { margin-top: 10px; font-size: 15px; color: var(--ink-soft); }
.buy-row { display: flex; gap: 10px; margin-top: 28px; }
.stepper { display: inline-flex; align-items: center; border-radius: 999px; background: var(--tile); }
.stepper button { width: 46px; height: 52px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; border-radius: 999px; }
.stepper span { min-width: 22px; text-align: center; font-weight: 500; }
.buy-row .pill { flex: 1; justify-content: center; }
.facts { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 10px; font-size: 15px; }
.facts li { display: flex; gap: 12px; align-items: center; }
details.more { margin-top: 24px; border-top: 1px solid var(--line); }
details.more summary { cursor: pointer; padding: 18px 0; font-weight: 500; list-style: none; display: flex; justify-content: space-between; }
details.more summary::-webkit-details-marker { display: none; }
details.more[open] summary svg { transform: rotate(45deg); }
details.more summary svg { transition: transform .25s var(--ease); }
details.more p { padding-bottom: 18px; max-width: 46ch; color: #48463F; }

/* Drawer */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(30, 28, 24, 0.32); opacity: 0; animation: in .3s var(--ease) forwards; }
.drawer { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--ground); padding: 24px; display: flex; flex-direction: column; gap: 20px; transform: translateX(100%); animation: slide .45s var(--ease) forwards; box-shadow: -18px 0 48px rgba(30, 28, 24, 0.16); }
@keyframes slide { to { transform: none; } }
@keyframes in { to { opacity: 1; } }
.drawer-head { display: flex; justify-content: space-between; align-items: center; }
.drawer-head h2 { font-size: 26px; }
.mini { display: flex; gap: 14px; align-items: center; background: var(--tile); padding: 12px; border-radius: 8px; }
.mini img { width: 76px; height: 76px; object-fit: cover; border-radius: 6px; }
.drawer .actions { margin-top: auto; display: grid; gap: 10px; }
.drawer .actions .pill { justify-content: center; width: 100%; }

/* Cart + checkout */
.page-title { font-size: clamp(40px, 4.4vw, 64px); padding: 32px 0 32px; }
.cart-grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: clamp(24px, 4vw, 64px); align-items: start; padding-bottom: clamp(56px, 8vw, 112px); }
.lines { border-top: 1px solid var(--line); }
.line { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 20px; padding: 20px 0; border-bottom: 1px solid var(--line); align-items: center; }
.line img { width: 112px; height: 112px; object-fit: cover; border-radius: 6px; }
.line h3 { font-family: var(--text); font-weight: 600; font-size: 19px; }
.line .meta { font-size: 15px; color: var(--ink-soft); margin-top: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.line .meta .fsw { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
.line .controls { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.line .controls .stepper button { height: 40px; width: 40px; }
.text-btn { border: 0; background: none; padding: 8px 0; min-height: 40px; font-size: 14px; text-decoration: underline; text-underline-offset: 0.2em; cursor: pointer; color: var(--ink-soft); }
.line .sum { font-weight: 500; align-self: start; padding-top: 4px; }
.summary { background: var(--tile); border-radius: 8px; padding: 28px; position: sticky; top: 96px; }
.summary .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
.summary .total { margin-top: 14px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 20px; font-weight: 500; }
.meter { height: 4px; border-radius: 4px; background: var(--ground); margin: 10px 0 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--slate); border-radius: 4px; transition: width .6s var(--ease); }
.hint { font-size: 14px; color: var(--ink-soft); }
.summary .pill { width: 100%; justify-content: center; margin-top: 22px; }
.summary .cod { margin-top: 14px; font-size: 14px; color: var(--ink-soft); text-align: center; }
.empty { padding: 72px 24px; text-align: center; background: var(--tile); border-radius: 8px; margin-bottom: 96px; }
.empty p { font-size: 20px; margin-bottom: 24px; }
.form { display: grid; gap: 18px; }
.form h2 { font-family: var(--text); font-size: 18px; font-weight: 500; margin-top: 8px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.field { display: grid; gap: 6px; font-size: 15px; font-weight: 400; }
.field input, .field textarea { font: inherit; font-weight: 400; color: var(--ink); background: var(--tile); border: 1px solid #CFCAC0; border-radius: 10px; min-height: 52px; padding: 0 16px; transition: border-color .2s var(--ease); }
.field textarea { padding: 14px 16px; min-height: 96px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(47, 47, 47, 0.12); }
.field small { font-size: 13px; color: var(--ink-soft); }
.was-validated .field input:invalid { border-color: #A3392B; }
.err { display: none; font-size: 13px; color: #A3392B; }
.was-validated .field input:invalid ~ .err { display: block; }
.paybox { display: flex; gap: 14px; padding: 18px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--tile); }
.paybox b { font-weight: 500; display: block; }
.paybox span { font-size: 15px; color: var(--ink-soft); }
.done { max-width: 640px; margin: 0 auto; text-align: center; padding: clamp(72px, 12vw, 160px) 0; }
.done h1 { font-size: clamp(44px, 5vw, 72px); }
.done p { margin-top: 16px; font-size: 18px; }
.done .steps { margin: 40px 0 0; padding: 0; list-style: none; text-align: left; display: grid; gap: 0; border-top: 1px solid var(--line); }
.done .steps li { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.done .steps li b { font-weight: 500; }
.done .pill { margin-top: 36px; }

@media (max-width: 960px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .materials-in, .pdp, .cart-grid { grid-template-columns: 1fr; }
  .buy, .summary { position: static; }
  .foot-in { grid-template-columns: 1fr 1fr; }
  .foot-in > div:first-child { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  body { font-size: 16px; }
  .bar-in { grid-template-columns: auto 1fr auto; height: 64px; }
  .nav { display: none; }
  .menu-btn { display: inline-grid; }
  .langs { display: none; }
  .sheet.open { display: block; position: fixed; inset: 64px 0 0 0; z-index: 19; background: var(--ground); color: var(--ink); padding: 16px var(--gutter); }
  .sheet a { display: block; font-family: var(--display); font-size: 32px; text-decoration: none; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .sheet .langs { display: flex; margin-top: 20px; }
  .hero { height: 78vh; min-height: 520px; }
  .pet-pills .pill { padding: 0 22px; }
  .service { grid-template-columns: 1fr; }
  .service div + div { padding-left: 0; border-left: 0; border-top: 1px solid var(--line); }
  .fabric-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .line { grid-template-columns: 84px minmax(0, 1fr); }
  .line img { width: 84px; height: 84px; }
  .line .sum { grid-column: 2; padding-top: 0; }
  .two { grid-template-columns: 1fr; }
  .story::before { background: linear-gradient(0deg, rgba(24, 20, 16, 0.72) 0%, rgba(24, 20, 16, 0.2) 70%); }
  .story { align-items: flex-end; padding-bottom: 48px; }
}
@media (max-width: 520px) {
  .grid { gap: 12px; }
  .tile h3 { font-size: 20px; }
  .tile .kind, .tile .from { font-size: 14px; }
  .fchip { right: 10px; bottom: 10px; padding: 6px 12px 6px 6px; gap: 8px; }
  .fchip .km-pair { --pair: 48px; }
  .fchip figcaption { font-size: 13px; }

/* Testimonials: one card, three shapes (photo, words, both) */

.km-t-photo + .km-t-words { padding-top: 18px; }

@keyframes km-row { to { transform: translate3d(-50%, 0, 0); } }

  function checkout(c) {
    var k = c.cart;
    var list = k.lines.map(function (l) { return '<div class="row"><span>' + l.qty + ' × ' + l.product.name + ', ' + l.size.id + '</span><span>' + l.total + '</span></div>'; }).join('');
    return '<div class="wrap"><h1 class="page-title">Poručivanje</h1><div class="cart-grid">' +
      '<form class="form" data-form="order" novalidate><h2>Podaci za dostavu</h2>' +
      '<div class="two">' + field('ime', 'Ime', 'text', 'autocomplete="given-name"') + field('prezime', 'Prezime', 'text', 'autocomplete="family-name"') + '</div>' +
      field('ulica', 'Ulica i broj', 'text', 'autocomplete="street-address"') +
      '<div class="two">' + field('grad', 'Grad', 'text', 'autocomplete="address-level2"') + field('postanski', 'Poštanski broj', 'text', 'inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{5}"') + '</div>' +
      field('telefon', 'Telefon', 'tel', 'autocomplete="tel"', 'Pozvaćemo vas da potvrdimo porudžbinu.') +
      field('email', 'Email', 'email', 'autocomplete="email"', 'Na ovu adresu šaljemo potvrdu porudžbine.') +
      '<label class="field">Napomena (opciono)<textarea name="napomena" rows="3"></textarea></label>' +
      '<h2>Način plaćanja</h2><div class="paybox">' + I.cash + '<p><b>Plaćanje pouzećem</b><span>Gotovinom kuriru pri preuzimanju paketa.</span></p></div>' +
      '<button class="pill slate" type="submit" style="justify-content:center">Poruči · ' + k.total + '</button></form>' +
      '<aside class="summary" aria-label="Vaša porudžbina">' + list + '<div class="row"><span>Dostava</span><span>' + k.shipping + '</span></div><div class="row total"><span>Ukupno</span><span>' + k.total + '</span></div><p class="final">Cene su konačne.</p></aside>' +
      '</div></div>';
  }

  function done(c) {
    var o = c.order || { number: 'KM-1042' };
    return '<div class="wrap"><div class="done"><h1>Hvala vam!</h1><p>Primili smo vašu porudžbinu <b>' + o.number + '</b>.</p>' +
      '<ol class="steps"><li><span>1</span><p><b>Zovemo vas</b><br>Zovemo vas' + (o.phone ? ' na ' + c.esc(o.phone) : '') + ' da potvrdimo porudžbinu.</p></li>' +
      '<li><span>2</span><p><b>Šijemo i šaljemo</b><br>' + c.delivery + '.</p></li>' +
      '<li><span>3</span><p><b>Plaćate kuriru</b><br>Gotovinom, kada paket stigne.</p></li></ol>' +
      '<a class="pill line" href="#/">Nazad na početnu</a></div></div>';
  }

  function footer(c) {
    return '<footer class="foot"><div class="wrap"><div class="foot-in"><div><span class="logo-stack">' + KM_LOGO.stack + '</span><p class="note">Premium krevetići za pse i mačke. Ovo je prototip: fotografije, utisci, nazivi modela i tkanina, cene, cena dostave i rok dostave su privremeni primeri.</p></div>' +
      '<div><h4>Kupovina</h4><ul><li><a href="#">Dostava i plaćanje</a></li><li><a href="#">Povrat u roku od 14 dana</a></li><li><a href="#">Uslovi kupovine</a></li><li><a href="#">Politika privatnosti</a></li></ul></div>' +
      '<div><h4>Kontakt</h4><ul><li>[Telefon]</li><li>[Email]</li><li><a href="https://www.instagram.com/ketty.mon/">Instagram</a> · <a href="#">Viber</a> · <a href="#">WhatsApp</a></li></ul></div></div>' +
      '<p class="legal">© KettyMon · Prodavac: ' + c.seller + ' · Nije u sistemu PDV-a · Cene su konačne. Plaćanje pouzećem.</p></div></footer>';
  }

  function added(k, root) {
    var last = k.lines[k.lines.length - 1];
    var wrap = document.createElement('div');
    wrap.innerHTML = '<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-t"><div class="drawer-head"><h2 id="dr-t">Dodato u korpu</h2><button class="icon-btn" type="button" data-act="close" aria-label="Zatvori">' + I.close + '</button></div>' +
      '<div class="mini"><img src="' + last.product.photos[0] + '" alt=""><div><b>' + last.product.name + '</b><p class="hint">' + last.size.id + ' · ' + last.fabricText + ' · ' + last.qty + ' kom.</p><p>' + last.total + '</p></div></div>' +
      (k.freeLeft ? '<p class="hint">Dodajte još ' + k.freeLeft + ' za besplatnu dostavu.</p>' : '<p class="hint">Dostava je besplatna.</p>') +
      '<div class="actions"><a class="pill slate" href="#/korpa">Idi u korpu · ' + k.total + '</a><button class="pill line" type="button" data-act="close">Nastavi kupovinu</button></div></aside>';
    root.appendChild(wrap);
    var btn = wrap.querySelector('.drawer .icon-btn'); if (btn) btn.focus();
  }

  function closeMenu() { menuOpen = false; }

  function act(a, el, ev, state, render) {
    if (a === 'menu') { menuOpen = !menuOpen; render(); }
    if (a === 'nav') { menuOpen = false; location.hash = el.getAttribute('data-to'); render(); }
    if (a === 'close') { render(); }
  }

  function after(c, root) {
    if (c.state.route.name !== 'home') menuOpen = false;
  }

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.querySelector('.drawer')) KM.render(); });

  KM.mount({ utisci: utisci, closeMenu: closeMenu, header: header, footer: footer, home: home, product: product, cart: cart, checkout: checkout, done: done, added: added, act: act, after: after });
})();
</script>
</body>
</html>
