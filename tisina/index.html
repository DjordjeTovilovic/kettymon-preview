<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KettyMon Tišina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=PT+Sans:wght@400;700&display=swap">
<style>
:root {
  --white: #FBFAF7;
  --cream: #F2ECE3;
  --ink: #2F2A25;
  --ink-soft: #645A50;
  --bronze: #6E4F2C;
  --gold: #957148;
  --line: #E2DAD0;
  --serif: 'EB Garamond', Georgia, serif;
  --sans: 'PT Sans', system-ui, sans-serif;
  --gutter: clamp(16px, 3vw, 40px);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: #D2C7B8 var(--white); accent-color: var(--ink); caret-color: var(--ink); }
body { margin: 0; background: var(--white); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; font-variant-numeric: tabular-nums; }
::selection { background: #E8DBC4; color: var(--ink); }
img { display: block; max-width: 100%; }
a { color: inherit; text-underline-offset: 4px; text-decoration-thickness: 1px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; line-height: 1.1; letter-spacing: -0.005em; text-wrap: balance; }
p { margin: 0; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 var(--gutter); }
.caps { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }

.bar { position: sticky; top: 0; z-index: 20; background: var(--white); border-bottom: 1px solid var(--line); }
.bar-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 76px; }
.nav { display: flex; gap: 26px; }
.nav a { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; padding: 10px 0; border-bottom: 1px solid transparent; }
.nav a:hover { border-color: var(--gold); }
.wordmark { text-decoration: none; display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.wordmark { --logo-gold: #957148; --logo-ink: #6E4F2C; }
.wordmark svg { display: block; height: 34px; width: auto; }
.logo-stack { display: block; width: 180px; --logo-gold: #957148; --logo-ink: #6E4F2C; }
.logo-stack svg { display: block; width: 100%; height: auto; }
.tools { display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
.langs { display: flex; gap: 2px; }
.langs button { border: 0; background: none; padding: 10px 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; cursor: pointer; color: var(--ink-soft); }
.langs button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 6px; }
.langs button:disabled { cursor: not-allowed; opacity: 0.55; }
.bag { position: relative; display: grid; place-items: center; width: 44px; height: 44px; text-decoration: none; }
.bag .cnt { position: absolute; top: 3px; right: 0; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 4px; background: var(--bronze); color: #FFFFFF; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
.mnav { display: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 26px; background: var(--ink); color: var(--white); border: 1px solid var(--ink); text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; transition: background .3s var(--ease), color .3s var(--ease); }
.btn:hover { background: var(--bronze); border-color: var(--bronze); }
.btn.line { background: transparent; color: var(--ink); }
.btn.line:hover { background: var(--ink); color: var(--white); }
.link { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 6px; }
.txt { border: 0; background: none; padding: 6px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
.arrows { display: flex; gap: 8px; align-items: center; }
.arrows button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--white); cursor: pointer; display: grid; place-items: center; transition: border-color .2s var(--ease); }
.arrows button:hover { border-color: var(--ink); }
.arrows button:disabled { opacity: 0.4; cursor: default; border-color: var(--line); }
.arrows .count { min-width: 44px; text-align: center; font-size: 14px; color: var(--ink-soft); }

/* hero */
.hero { padding-top: var(--gutter); }
.frame { position: relative; height: clamp(520px, calc(100svh - 76px - 2 * var(--gutter)), 820px); overflow: hidden; background: var(--cream); }
.frame > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.frame > img.in-next { animation: in-next .9s var(--ease); }
.frame > img.in-prev { animation: in-prev .9s var(--ease); }
@keyframes in-next { from { clip-path: inset(0 0 0 100%); transform: translateX(4%); } to { clip-path: inset(0); transform: none; } }
@keyframes in-prev { from { clip-path: inset(0 100% 0 0); transform: translateX(-4%); } to { clip-path: inset(0); transform: none; } }
.caption, .frame .arrows { z-index: 2; }
.caption { position: absolute; left: clamp(16px, 3vw, 40px); bottom: clamp(16px, 3vw, 40px); width: min(420px, calc(100% - 32px)); background: var(--white); padding: 30px 32px 28px; outline: 1px solid var(--line); outline-offset: -8px; }
.side-r .caption { left: auto; right: clamp(16px, 3vw, 40px); }
.caption h1 { font-size: clamp(34px, 3.2vw, 46px); }
.caption .blurb { margin-top: 10px; color: var(--ink-soft); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 18px; }
.chip { min-width: 48px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 14px; font-weight: 700; transition: border-color .2s var(--ease); }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); color: var(--ink); }
.caption .fit { margin-top: 8px; font-size: 14px; color: var(--ink-soft); }
.caption .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px; flex-wrap: wrap; }
.caption .price { font-family: var(--serif); font-size: 26px; }
.caption .more { margin-top: 16px; }
.frame .arrows { position: absolute; right: clamp(16px, 3vw, 40px); bottom: clamp(16px, 3vw, 40px); background: var(--white); padding: 6px; outline: 1px solid var(--line); outline-offset: -3px; }
.side-r .arrows { right: auto; left: clamp(16px, 3vw, 40px); }
.frame .arrows button { border-color: transparent; }
.frame .arrows button:hover { border-color: var(--line); }

.sec { padding: clamp(72px, 8vw, 112px) 0 0; }
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }
.sec-head h2 { font-size: clamp(34px, 3.4vw, 48px); }
.tabs { display: flex; gap: 22px; }
.tabs button { border: 0; border-bottom: 1px solid transparent; background: none; padding: 8px 0; cursor: pointer; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
.tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--gold); }
.head-tools { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
.note-row { margin: -10px 0 18px; color: var(--ink-soft); }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 3 * 20px) / 4); gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
.rail::-webkit-scrollbar { display: none; }
.card { scroll-snap-align: start; }
.card .ph { position: relative; display: block; aspect-ratio: 3 / 4; overflow: hidden; background: var(--cream); }
.card .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
.card:hover .ph img { transform: scale(1.03); }
.card .ph img.alt { position: absolute; inset: 0; opacity: 0; transition: opacity .5s var(--ease), transform 1.2s var(--ease); }
.card:hover .ph img.alt, .card:focus-within .ph img.alt { opacity: 1; }
.card .new { position: absolute; top: 10px; left: 10px; background: var(--white); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 9px; }
.card h3 { font-size: 22px; margin-top: 14px; }
.card h3 a { text-decoration: none; }
.card .sub { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
.card .price { margin-top: 6px; }
.empty-row { padding: 40px 0; color: var(--ink-soft); }

.band { background: var(--cream); margin-top: clamp(72px, 8vw, 112px); padding: clamp(56px, 7vw, 96px) 0; text-align: center; }
.band h2 { font-size: clamp(34px, 3.4vw, 48px); }
.band .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 40px; text-align: left; }
.band .cols div { padding: 6px 32px; }
.band .cols div + div { border-left: 1px solid #D9CEBF; }
.band h3 { font-size: 24px; }
.band p { margin-top: 10px; color: var(--ink-soft); max-width: 34ch; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.tile { position: relative; display: block; aspect-ratio: 4 / 3.4; overflow: hidden; text-decoration: none; background: var(--cream); }
.tile img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
.tile:hover img { transform: scale(1.03); }
.tile .cap { position: absolute; left: 20px; bottom: 20px; right: 20px; max-width: 360px; background: var(--white); padding: 22px 24px; outline: 1px solid var(--line); outline-offset: -7px; }
.tile .cap h3 { font-size: 28px; }
.tile .cap p { margin-top: 6px; color: var(--ink-soft); font-size: 15px; }
.tile .cap .link { display: inline-block; margin-top: 12px; }
.voice { text-align: center; padding: clamp(80px, 9vw, 128px) 0 0; }
.voice blockquote { margin: 0 auto; max-width: 28ch; font-family: var(--serif); font-size: clamp(28px, 3vw, 40px); line-height: 1.3; }
.voice figcaption { margin-top: 20px; color: var(--ink-soft); }
.faq { max-width: 880px; margin: 0 auto; }
.faq h2 { text-align: center; margin-bottom: 26px; font-size: clamp(34px, 3.4vw, 48px); }
.faq details { border-top: 1px solid var(--line); }
.faq details:last-child { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 0; font-family: var(--serif); font-size: 22px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary svg { flex: none; color: var(--gold); transition: transform .3s var(--ease); }
.faq details[open] summary svg { transform: rotate(45deg); }
.faq p { padding: 0 0 22px; color: var(--ink-soft); }
.added { position: fixed; z-index: 30; right: 20px; top: 92px; background: var(--white); border: 1px solid var(--line); padding: 16px 18px; display: flex; gap: 16px; align-items: center; font-size: 14px; box-shadow: 0 18px 40px -22px rgba(47, 42, 37, 0.45); animation: drop .45s var(--ease); }
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

.foot { background: var(--cream); margin-top: clamp(80px, 10vw, 140px); padding: 60px 0 28px; font-size: 15px; }
.foot-in { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 32px; }
.foot p.lead { margin-top: 18px; max-width: 40ch; color: var(--ink-soft); }
.foot h4 { margin: 0 0 14px; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.foot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.foot .legal { margin-top: 44px; padding-top: 18px; border-top: 1px solid #D9CEBF; font-size: 13px; color: var(--ink-soft); }

/* product page */
.crumb { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin-top: 16px; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.pdp { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: clamp(28px, 4vw, 64px); margin-top: 12px; align-items: start; }
.main-img { position: relative; aspect-ratio: 4 / 4.4; overflow: hidden; background: var(--cream); }
.main-img img { width: 100%; height: 100%; object-fit: cover; }
.mine { position: absolute; left: 12px; bottom: 12px; z-index: 2; margin: 0; display: flex; align-items: center; gap: 12px; max-width: calc(100% - 120px); padding: 8px 18px 8px 8px; background: var(--white); outline: 1px solid var(--line); outline-offset: -5px; }
.km-pair { position: relative; display: block; flex: none; width: var(--pair); height: var(--pair); }
.km-pair img { position: absolute; display: block; object-fit: cover; border-radius: 50%; }
.km-pair .km-shell { left: 0; top: 0; width: 80%; height: 80%; }
.km-pair .km-pad { right: 0; bottom: 0; width: 58%; height: 58%; box-shadow: 0 0 0 3px var(--white); }
.mine .km-pair { --pair: 60px; }
.mine figcaption { display: grid; grid-template-columns: auto auto; gap: 2px 12px; align-items: baseline; font-size: 14px; line-height: 1.4; color: var(--ink); }
.mine figcaption span { font-size: 12px; color: var(--ink-soft); }
.main-img .arrows { position: absolute; right: 12px; bottom: 12px; background: var(--white); padding: 4px; }
.main-img .arrows button { border-color: transparent; }
.thumbs { display: flex; gap: 10px; margin-top: 10px; }
.thumbs button { width: 84px; aspect-ratio: 1; padding: 0; border: 1px solid transparent; background: none; cursor: pointer; }
.thumbs button[aria-current="true"] { border-color: var(--gold); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.side { position: sticky; top: 100px; }
.side h1 { font-size: clamp(36px, 3.2vw, 48px); }
.side .sub { margin-top: 6px; color: var(--ink-soft); }
.side .price { margin-top: 16px; font-family: var(--serif); font-size: 28px; }
.side .final { font-size: 14px; color: var(--ink-soft); }
.side .blurb { margin-top: 14px; color: var(--ink-soft); }
.lbl { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.lbl span { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink-soft); font-size: 15px; }
.fabrics { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.fab { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 14px 6px 6px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 15px; }
.fab img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
.fab[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.sizes { margin-top: 10px; display: grid; gap: 8px; }
.sz { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; padding: 8px 16px; border: 1px solid var(--line); background: transparent; cursor: pointer; text-align: left; font-size: 15px; transition: border-color .2s var(--ease); }
.sz:hover { border-color: var(--ink-soft); }
.sz[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.sz b { font-weight: 700; margin-right: 10px; }
.sz span { color: var(--ink-soft); }
.buy { display: flex; gap: 10px; margin-top: 22px; }
.buy .btn { flex: 1; }
@media (max-width: 1360px) { .buy .btn .s { display: none; } }
.qty { display: flex; align-items: center; border: 1px solid var(--line); }
.qty button { width: 44px; height: 46px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.qty span { min-width: 22px; text-align: center; }
.cod { margin-top: 16px; padding: 16px 18px; border: 1px solid var(--line); background: var(--cream); display: grid; grid-template-columns: 24px 1fr; gap: 12px; font-size: 15px; }
.cod svg { color: var(--gold); }

/* cart, checkout, done */
.page-title { font-size: clamp(38px, 4vw, 56px); margin: 36px 0 26px; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: clamp(28px, 4vw, 60px); align-items: start; }
.item { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 18px; padding: 20px 0; border-top: 1px solid var(--line); align-items: start; }
.item > img { width: 110px; aspect-ratio: 3 / 4; height: auto; object-fit: cover; }
.item h3 { font-size: 22px; }
.item .meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; color: var(--ink-soft); font-size: 14px; }
.item .meta img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
.item .ctl { display: flex; gap: 16px; align-items: center; margin-top: 12px; }
.item .ctl .qty button { height: 40px; width: 40px; }
.item .sum { font-family: var(--serif); font-size: 20px; }
.sumbox { background: var(--cream); padding: 26px; position: sticky; top: 100px; }
.sumbox .row { display: flex; justify-content: space-between; padding: 5px 0; }
.sumbox .total { margin-top: 10px; padding-top: 14px; border-top: 1px solid #D9CEBF; font-family: var(--serif); font-size: 24px; }
.sumbox .muted { font-size: 14px; color: var(--ink-soft); margin-top: 6px; }
.sumbox .btn { width: 100%; margin-top: 18px; }
.progress { height: 2px; background: #D9CEBF; margin-top: 10px; }
.progress i { display: block; height: 100%; background: var(--gold); }
.empty h2 { font-size: 32px; margin-bottom: 24px; }
.form h2 { font-size: 30px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.f { display: block; margin-top: 16px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
.f input, .f textarea { display: block; width: 100%; margin-top: 6px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 0; background: #FFFFFF; font: 16px var(--sans); letter-spacing: 0; text-transform: none; color: var(--ink); }
.f input:focus, .f textarea:focus { outline: none; border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.f small { display: block; margin-top: 5px; font-size: 13px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink-soft); }
.f .err { display: none; color: #9A3A22; }
.was-validated .f input:invalid { border-color: #9A3A22; }
.was-validated .f input:invalid ~ .err { display: block; }
.form .cod { margin-top: 22px; }
.form .btn { width: 100%; margin-top: 20px; }
.done { max-width: 720px; margin: 0 auto; padding-top: 56px; text-align: center; }
.done h1 { font-size: clamp(44px, 5vw, 64px); }
.done > p { margin-top: 14px; font-size: 18px; color: var(--ink-soft); }
.done .band { margin-top: 36px; padding: 32px; text-align: left; }
.done .band .cols { grid-template-columns: 1fr; margin-top: 0; }
.done .band .cols div { padding: 14px 0; }
.done .band .cols div + div { border-left: 0; border-top: 1px solid #D9CEBF; }
.done .btn { margin-top: 32px; }

@media (min-width: 761px) and (max-width: 1200px) {
  .caption { width: 340px; padding: 24px 26px 22px; }
  .caption .blurb { display: none; }
}
@media (max-width: 1000px) {
  .rail { grid-auto-columns: calc((100% - 20px) / 2.3); }
  .pdp, .two-col { grid-template-columns: 1fr; }
  .side, .sumbox { position: static; }
}
@media (max-width: 760px) {
  .bar-in { grid-template-columns: auto 1fr; height: 62px; }
  .nav { display: none; }
  .wordmark { align-items: flex-start; }
  .wordmark svg { height: 26px; }
  .langs button:disabled { display: none; }
  .mnav { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; padding: 0 var(--gutter); border-top: 1px solid var(--line); }
  .mnav a { flex: none; padding: 12px 0; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; }
  .hero { padding-top: 0; }
  .hero .wrap { padding: 0; }
  .frame { height: auto; display: flex; flex-direction: column; overflow: visible; }
  .frame > img { position: relative; height: 54svh; min-height: 300px; }
  .caption { position: relative; left: 0; bottom: 0; width: 100%; padding: 22px var(--gutter) 6px; }
  .caption .row .btn { flex: 1; }
  .frame .arrows, .side-r .arrows { top: calc(54svh - 64px); bottom: auto; right: 12px; left: auto; }
  .side-r .caption { right: 0; }
  .rail { grid-auto-columns: 72%; }
  .band .cols { grid-template-columns: 1fr; }
  .band .cols div { padding: 16px 0; }
  .band .cols div + div { border-left: 0; border-top: 1px solid #D9CEBF; }
  .duo { grid-template-columns: 1fr; }
  .tile { aspect-ratio: 4 / 4.4; }
  .foot-in { grid-template-columns: 1fr 1fr; }
  .foot-in > div:first-child { grid-column: 1 / -1; }
  .item { grid-template-columns: 84px minmax(0, 1fr); }
  .item > img { width: 84px; }
  .item .sum { grid-column: 2; }
  .pair { grid-template-columns: 1fr; gap: 0; }
  .buy .btn .s { display: none; }
  .added { left: 16px; right: 16px; top: 76px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="logo.js"></script>
<script src="shop.js"></script>
<script>
(function () {
  var I = {
    bag: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 8h13l-1.1 12.2a1 1 0 0 1-1 .8H7.6a1 1 0 0 1-1-.8L5.5 8Z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>',
    plus: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    minus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>',
    left: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
    prev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    next: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
    cash: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6.5" width="19" height="11"/><circle cx="12" cy="12" r="2.6"/></svg>'
  };
  var P = ['oblak', 'luna', 'klupko', 'medo', 'mezimce', 'roza'].map(KM.find);
  var ui = { hero: 0, dir: '', from: '', heroSize: {}, added: null, rail: 0 };
  // models whose animal sits left of centre get the caption card on the right
  var RIGHT = { oblak: true, klupko: true, medo: true, mezimce: true };
  P.forEach(function (p) { new Image().src = p.photos[0]; });

  function header(c) {
    var links = '<a href="#/proizvodi" data-act="browse">Krevetići</a><a href="#/proizvodi" data-act="browse" data-coll="Poznato. Ali novo.">Kolekcija</a><a href="#/tkanine">Tkanine</a>';
    return '<header class="bar"><div class="wrap bar-in"><nav class="nav" aria-label="Glavni meni">' + links + '</nav>' +
      '<a class="wordmark" href="#/" aria-label="KettyMon, početna">' + KM_LOGO.row + '</a>' +
      '<div class="tools"><div class="langs" role="group" aria-label="Jezik"><button type="button" aria-pressed="true" title="Srpski">SR</button><button type="button" disabled title="U pripremi">EN</button><button type="button" disabled title="U pripremi">RU</button></div>' +
      '<a class="bag" href="#/korpa" aria-label="Korpa, ' + c.cart.count + ' proizvoda">' + I.bag + (c.cart.count ? '<span class="cnt">' + c.cart.count + '</span>' : '') + '</a></div></div>' +
      '<nav class="mnav" aria-label="Kategorije">' + links + '<a href="#/pitanja">Pitanja</a></nav></header>';
  }

  function hero(c) {
    var p = P[ui.hero], sid = ui.heroSize[p.id] || p.sizes[Math.min(1, p.sizes.length - 1)].id;
    var z = p.sizes.filter(function (s) { return s.id === sid; })[0];
    return '<section class="hero" aria-label="Izdvojeni model"><div class="wrap"><div class="frame' + (RIGHT[p.id] ? ' side-r' : '') + '">' + (ui.dir && ui.from ? '<img class="hero-old" src="' + ui.from + '" alt="">' : '') + '<img class="hero-img" src="' + p.photos[0] + '" alt="' + p.kind + ' ' + p.name + '" fetchpriority="high">' +
      '<div class="caption"><h1>' + p.name + '</h1><p class="fit">' + p.kind + '</p><p class="blurb">' + p.blurb + '</p>' +
      '<div class="chips" role="group" aria-label="Veličina">' + p.sizes.map(function (s) { return '<button type="button" class="chip" data-act="hsize" data-size="' + s.id + '" aria-pressed="' + (s.id === sid) + '">' + s.id + '</button>'; }).join('') + '</div>' +
      '<p class="fit">' + z.dims + ' · ' + z.pet + '<br>Jastuk: ' + c.fabrics[p.pad].name + ' · Spoljni deo: ' + c.fabrics[p.shell].name + '</p>' +
      '<div class="row"><span class="price">' + KM.fmt(z.price) + '</span><button type="button" class="btn" data-act="quick" data-pid="' + p.id + '" data-size="' + sid + '">Dodaj u korpu</button></div>' +
      '<p class="more"><a class="link" href="#/p/' + p.id + '">Pogledaj model</a></p></div>' +
      '<div class="arrows"><button type="button" data-act="hstep" data-d="-1" aria-label="Prethodni model">' + I.prev + '</button><span class="count" aria-live="polite">' + (ui.hero + 1) + ' / ' + P.length + '</span><button type="button" data-act="hstep" data-d="1" aria-label="Sledeći model">' + I.next + '</button></div></div></div></section>';
  }

  function card(p) {
    return '<article class="card"><a class="ph" href="#/p/' + p.id + '" tabindex="-1" aria-hidden="true"><img src="' + p.photos[0] + '" alt="" loading="lazy">' + (p.photos[1] ? '<img class="alt" src="' + p.photos[1] + '" alt="" loading="lazy">' : '') + (p.isNew ? '<span class="new">Novo</span>' : '') + '</a>' +
      '<h3><a href="#/p/' + p.id + '">' + p.name + '</a></h3><p class="sub">' + p.kind + ' · ' + p.sizeLabel + '</p><p class="price">' + p.from + '</p></article>';
  }

  function home(c) {
    var s = c.state;
    var tabs = [['', 'Svi'], [c.collection, 'Kolekcija']].map(function (t) { return '<button type="button" data-act="coll" data-coll="' + t[0] + '" aria-pressed="' + (s.coll === t[0]) + '">' + t[1] + '</button>'; }).join('');
    return hero(c) +
      '<section class="sec" id="proizvodi"><div class="wrap"><div class="sec-head"><h2>Iz radionice</h2><div class="head-tools"><div class="tabs" role="group" aria-label="Kolekcija">' + tabs + '</div>' +
      '<div class="arrows"><button type="button" data-act="rail" data-d="-1" aria-label="Prethodni modeli">' + I.prev + '</button><button type="button" data-act="rail" data-d="1" aria-label="Sledeći modeli">' + I.next + '</button></div></div></div>' +
      (c.filterNote ? '<p class="note-row">' + c.filterNote + ' · <button type="button" class="txt" data-act="browse">Prikaži sve</button></p>' : '') +
      (c.products.length ? '<div class="rail" tabindex="0" aria-label="Modeli">' + c.products.map(card).join('') + '</div>' : '<p class="empty-row">Nema modela u ovom izboru.</p>') + '</div></section>' +
      '<section class="band"><div class="wrap"><h2>Kako kupujete</h2><div class="cols">' +
      '<div><h3>Poručite na sajtu</h3><p>Bez registracije i bez kartice. Dovoljni su adresa i telefon.</p></div>' +
      '<div><h3>Zovemo vas</h3><p>Potvrdimo porudžbinu telefonom. ' + c.delivery + '.</p></div>' +
      '<div><h3>Plaćate kuriru</h3><p>Gotovinom, kada paket stigne. Povrat u roku od 14 dana.</p></div></div></div></section>' +
      '<section class="sec" id="kolekcija"><div class="wrap duo">' +
      '<a class="tile" href="#/proizvodi" data-act="browse" data-coll="Poznato. Ali novo."><img src="img/cat-pink-cushion.webp" alt="" loading="lazy"><div class="cap"><h3>Poznato. Ali novo.</h3><p>Modeli koje već volite, u novim tkaninama. Nova kolekcija je u izradi.</p><span class="link">Pogledaj kolekciju</span></div></a>' +
      '<a class="tile" id="tkanine" href="#/p/oblak"><img src="img/room-wide-saluki.webp" alt="" loading="lazy"><div class="cap"><h3>Dve tkanine, jedna cena</h3><p>Tkaninu birate posebno za jastuk i za spoljni deo, a cena zavisi samo od veličine.</p><span class="link">Izaberite tkanine</span></div></a></div></section>' +
      '<figure class="voice wrap" id="utisci"><blockquote>„Šarko je od prvog dana spavao samo na svom KettyMon krevetiću. Sad ne može da ga namami ni kauč.“</blockquote><figcaption>Šarko, mešanac · primer utiska</figcaption></figure>' +
      '<section class="sec" id="pitanja"><div class="wrap"><div class="faq"><h2>Pitanja</h2>' +
      '<details><summary>Kako da izaberem veličinu? ' + I.plus + '</summary><p>Uz svaku veličinu piše za koliko kilograma je namenjena. Ako vaš ljubimac voli da se ispruži, uzmite jednu veličinu veću.</p></details>' +
      '<details><summary>Koliko košta dostava? ' + I.plus + '</summary><p>Dostava košta ' + c.fee + ', a za porudžbine od ' + c.freeFrom + ' je besplatna.</p></details>' +
      '<details><summary>Kako plaćam? ' + I.plus + '</summary><p>Pouzećem: gotovinom kuriru kada paket stigne. Pre slanja vas zovemo da potvrdimo porudžbinu.</p></details>' +
      '<details><summary>Mogu li da vratim krevetić? ' + I.plus + '</summary><p>Da, u roku od 14 dana od preuzimanja. Troškove povratne dostave plaćate vi.</p></details></div></div></section>';
  }

  function fabrics(part, label, cur, opts) {
    return '<p class="lbl">' + label + ' <span>· ' + cur.name + '</span></p><div class="fabrics" role="group" aria-label="Tkanina, ' + label.toLowerCase() + '">' + opts.map(function (f) { return '<button type="button" class="fab" data-act="' + part + '" data-fabric="' + f.id + '" aria-pressed="' + f.on + '"><img src="' + f.img + '" alt="">' + f.name + '</button>'; }).join('') + '</div>';
  }

  function product(c) {
    var v = c.pv, p = v.p, pk = v.pick, g = v.gallery[v.view], n = v.gallery.length;
    return '<div class="wrap"><a class="crumb" href="#/proizvodi">' + I.left + 'Svi modeli</a><div class="pdp"><div><div class="main-img"><img src="' + g.src + '" alt="' + g.alt + '">' +
      '<figure class="mine" aria-live="polite">' + v.pair + '<figcaption><span>Jastuk</span>' + v.pad.name + '<span>Spoljni deo</span>' + v.shell.name + '</figcaption></figure>' +
      '<div class="arrows"><button type="button" data-act="view" data-view="' + ((v.view - 1 + n) % n) + '" aria-label="Prethodna slika">' + I.prev + '</button><button type="button" data-act="view" data-view="' + ((v.view + 1) % n) + '" aria-label="Sledeća slika">' + I.next + '</button></div></div>' +
      '<div class="thumbs">' + v.gallery.map(function (t, i) { return '<button type="button" data-act="view" data-view="' + i + '" aria-current="' + (i === v.view) + '" aria-label="Slika ' + (i + 1) + '"><img src="' + t.src + '" alt=""></button>'; }).join('') + '</div></div>' +
      '<div class="side"><h1>' + p.name + '</h1><p class="sub">' + p.kind + ' · ' + v.sizeLabel + (p.collection ? ' · Kolekcija ' + p.collection : '') + '</p>' +
      '<p class="price">' + v.price + '</p><p class="final">Cene su konačne. Cena zavisi samo od veličine.</p><p class="blurb">' + p.blurb + '</p>' +
      fabrics('pad', 'Jastuk', v.pad, v.padOptions) + fabrics('shell', 'Spoljni deo', v.shell, v.shellOptions) +
      '<p class="lbl">Veličina <span>· prema težini ljubimca</span></p><div class="sizes">' + p.sizes.map(function (z) { return '<button type="button" class="sz" data-act="size" data-size="' + z.id + '" aria-pressed="' + (z.id === v.size.id) + '"><span><b>' + z.id + '</b>' + z.dims + ' · ' + z.pet + '</span><span>' + KM.fmt(z.price) + '</span></button>'; }).join('') + '</div>' +
      '<div class="buy"><div class="qty"><button type="button" data-act="qty" data-d="-1" aria-label="Smanji količinu">' + I.minus + '</button><span aria-live="polite">' + pk.qty + '</span><button type="button" data-act="qty" data-d="1" aria-label="Povećaj količinu">' + I.plus + '</button></div><button type="button" class="btn" data-act="add">Dodaj u korpu<span class="s">&nbsp;· ' + v.addTotal + '</span></button></div>' +
      '<div class="cod">' + I.cash + '<p>Plaćanje pouzećem. Zovemo vas da potvrdimo porudžbinu, ' + c.delivery.toLowerCase() + ', a plaćate kuriru.</p></div></div></div></div>';
  }

  function sumbox(c, action) {
    var k = c.cart;
    return '<aside class="sumbox" aria-label="Pregled porudžbine"><div class="row"><span>Međuzbir</span><span>' + k.subtotal + '</span></div><div class="row"><span>Dostava</span><span>' + k.shipping + '</span></div>' +
      (k.freeLeft ? '<div class="progress" aria-hidden="true"><i style="width:' + k.freeProgress + '%"></i></div><p class="muted">Još ' + k.freeLeft + ' do besplatne dostave.</p>' : '') +
      '<div class="row total"><span>Ukupno</span><span>' + k.total + '</span></div><p class="muted">Cene su konačne. Plaćate kuriru.</p>' + action + '</aside>';
  }

  function cart(c) {
    var k = c.cart;
    if (k.empty) return '<div class="wrap"><h1 class="page-title">Korpa</h1><div class="empty"><h2>Korpa je prazna.</h2><a class="btn" href="#/proizvodi">Pogledaj modele</a></div></div>';
    return '<div class="wrap"><h1 class="page-title">Korpa</h1><div class="two-col"><div>' + k.lines.map(function (l) {
      return '<div class="item"><img src="' + l.product.photos[0] + '" alt=""><div><h3>' + l.product.name + '</h3><p class="meta">' + l.product.kind + ' · ' + l.size.id + ', ' + l.size.dims + '</p><p class="meta"><img src="' + l.pad.img + '" alt=""><img src="' + l.shell.img + '" alt="">' + l.fabricText + '</p><div class="ctl"><div class="qty"><button type="button" data-act="line" data-i="' + l.index + '" data-d="-1" aria-label="Smanji količinu">' + I.minus + '</button><span>' + l.qty + '</span><button type="button" data-act="line" data-i="' + l.index + '" data-d="1" aria-label="Povećaj količinu">' + I.plus + '</button></div><button type="button" class="txt" data-act="remove" data-i="' + l.index + '">Ukloni</button></div></div><p class="sum">' + l.total + '</p></div>';
    }).join('') + '</div>' + sumbox(c, '<a class="btn" href="#/porucivanje">Završi kupovinu</a>') + '</div></div>';
  }

  function f(name, label, type, extra, help) {
    return '<label class="f">' + label + '<input name="' + name + '" type="' + type + '" required ' + (extra || '') + '>' + (help ? '<small>' + help + '</small>' : '') + '<small class="err">Popunite ovo polje.</small></label>';
  }

  function checkout(c) {
    return '<div class="wrap"><h1 class="page-title">Poručivanje</h1><div class="two-col"><form class="form" data-form="order" novalidate><h2>Gde da pošaljemo?</h2>' +
      '<div class="pair">' + f('ime', 'Ime', 'text', 'autocomplete="given-name"') + f('prezime', 'Prezime', 'text', 'autocomplete="family-name"') + '</div>' + f('ulica', 'Ulica i broj', 'text', 'autocomplete="street-address"') +
      '<div class="pair">' + f('grad', 'Grad', 'text', 'autocomplete="address-level2"') + f('postanski', 'Poštanski broj', 'text', 'inputmode="numeric" pattern="[0-9]{5}" autocomplete="postal-code"') + '</div>' +
      f('telefon', 'Telefon', 'tel', 'autocomplete="tel"', 'Zovemo vas da potvrdimo porudžbinu.') + f('email', 'Email', 'email', 'autocomplete="email"', 'Ovde stiže potvrda.') +
      '<label class="f">Napomena (opciono)<textarea name="napomena" rows="3"></textarea></label>' +
      '<div class="cod">' + I.cash + '<p>Plaćanje pouzećem: gotovinom kuriru pri preuzimanju paketa.</p></div>' +
      '<button class="btn" type="submit">Poruči · ' + c.cart.total + '</button></form>' + sumbox(c, '') + '</div></div>';
  }

  function done(c) {
    var o = c.order || { number: 'KM-1042' };
    return '<div class="wrap"><div class="done"><h1>Hvala vam!</h1><p>Primili smo vašu porudžbinu <b>' + o.number + '</b>.</p><div class="band"><div class="cols">' +
      '<div><h3>Uskoro vas zovemo</h3><p>Zovemo vas' + (o.phone ? ' na ' + c.esc(o.phone) : '') + ' da potvrdimo porudžbinu.</p></div>' +
      '<div><h3>Šijemo i šaljemo</h3><p>' + c.delivery + '.</p></div><div><h3>Plaćate kuriru</h3><p>Gotovinom, kada paket stigne.</p></div></div></div><a class="btn" href="#/">Nazad na početnu</a></div></div>';
  }

  function footer(c) {
    return '<footer class="foot"><div class="wrap"><div class="foot-in"><div><span class="logo-stack">' + KM_LOGO.stack + '</span><p class="lead">Ručno šiveni krevetići za pse i mačke. Prototip: fotografije, nazivi modela i tkanina, cene, cena dostave i rok dostave su privremeni primeri.</p></div>' +
      '<div><h4>Kupovina</h4><ul><li><a href="#">Dostava i plaćanje</a></li><li><a href="#">Povrat u roku od 14 dana</a></li><li><a href="#">Uslovi kupovine</a></li><li><a href="#">Politika privatnosti</a></li></ul></div>' +
      '<div><h4>Kontakt</h4><ul><li>[Telefon]</li><li>[Email]</li><li><a href="https://www.instagram.com/ketty.mon/">Instagram</a> · <a href="#">Viber</a> · <a href="#">WhatsApp</a></li></ul></div></div>' +
      '<p class="legal">© KettyMon · Prodavac: ' + c.seller + ' · Nije u sistemu PDV-a · Cene su konačne.</p></div></footer>';
  }

  function act(a, el, ev, state, render) {
    var rl = document.querySelector('.rail'); ui.rail = rl && a !== 'rail' ? rl.scrollLeft : 0;
    if (a === 'hstep') { ui.from = P[ui.hero].photos[0]; var d = +el.getAttribute('data-d'); ui.hero = (ui.hero + d + P.length) % P.length; ui.dir = d > 0 ? 'in-next' : 'in-prev'; render(); var b = document.querySelector('[data-act="hstep"][data-d="' + d + '"]'); if (b) b.focus({ preventScroll: true }); }
    if (a === 'hsize') { ui.heroSize[P[ui.hero].id] = el.getAttribute('data-size'); render(); }
    if (a === 'quick') {
      var p = KM.find(el.getAttribute('data-pid')), size = el.getAttribute('data-size');
      var found = state.cart.filter(function (l) { return l.pid === p.id && l.pad === p.pad && l.shell === p.shell && l.size === size; })[0];
      if (found) found.qty = Math.min(9, found.qty + 1); else state.cart.push({ pid: p.id, pad: p.pad, shell: p.shell, size: size, qty: 1 });
      try { sessionStorage.setItem('km-cart', JSON.stringify(state.cart)); } catch (e) { /* storage unavailable */ }
      ui.added = p.name + ', ' + size; render();
    }
    if (a === 'rail') {
      var r = document.querySelector('.rail');
      if (!r) return;
      var from = r.scrollLeft, to = Math.max(0, Math.min(r.scrollWidth - r.clientWidth, from + (+el.getAttribute('data-d')) * r.clientWidth * 0.75));
      r.scrollTo({ left: to, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
      // some browsers drop a smooth scroll on a snapping row; land on the target anyway
      setTimeout(function () { if (Math.abs(r.scrollLeft - from) < 2 && to !== from) r.scrollTo({ left: to, behavior: 'instant' }); }, 700);
    }
  }

  function after(c, root) {
    var img = root.querySelector('.hero-img');
    if (img && ui.dir) {
      img.classList.add(ui.dir); ui.dir = ''; ui.from = '';
      img.addEventListener('animationend', function () { var old = root.querySelector('.hero-old'); if (old) old.remove(); }, { once: true });
    }
    if (img) {
      var x0 = null;
      img.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
      img.addEventListener('touchend', function (e) {
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) > 40) { var b = root.querySelector('[data-act="hstep"][data-d="' + (dx < 0 ? 1 : -1) + '"]'); if (b) b.click(); }
      });
    }
    var r = root.querySelector('.rail');
    if (r) {
      if (ui.rail) { r.scrollLeft = ui.rail; ui.rail = 0; }
      var sync = function () {
        var prev = root.querySelector('[data-act="rail"][data-d="-1"]'), next = root.querySelector('[data-act="rail"][data-d="1"]');
        if (prev) prev.disabled = r.scrollLeft < 4;
        if (next) next.disabled = r.scrollLeft + r.clientWidth >= r.scrollWidth - 4;
      };
      r.addEventListener('scroll', sync, { passive: true }); sync();
      if (window.ResizeObserver) new ResizeObserver(sync).observe(r);
    }
    if (ui.added) {
      var t = document.createElement('div');
      t.className = 'added'; t.setAttribute('role', 'status');
      t.innerHTML = '<span>Dodato u korpu: ' + ui.added + '</span><a class="link" href="#/korpa">Korpa</a>';
      root.appendChild(t); ui.added = null;
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 4000);
    }
  }

  KM.mount({ header: header, footer: footer, home: home, product: product, cart: cart, checkout: checkout, done: done, act: act, after: after });
})();
</script>
</body>
</html>
