<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KettyMon San</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Spectral:wght@200;300;400&display=swap">
<style>
:root {
  --linen: #F6F1EA;
  --oat: #EDE5D9;
  --ink: #33291F;
  --ink-soft: #63554A;
  --bronze: #6E4F2C;
  --gold: #957148;
  --line: #DDD2C3;
  --display: 'Spectral', Georgia, serif;
  --sans: 'Manrope', system-ui, sans-serif;
  --gutter: clamp(16px, 3.4vw, 48px);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: #CDBFAC var(--linen); accent-color: var(--ink); caret-color: var(--ink); }
body { margin: 0; background: var(--linen); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; font-variant-numeric: tabular-nums; }
::selection { background: #E3D3B8; color: var(--ink); }
img { display: block; max-width: 100%; }
a { color: inherit; text-underline-offset: 4px; text-decoration-thickness: 1px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); font-weight: 300; margin: 0; line-height: 1.05; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
.wrap { max-width: 1480px; margin: 0 auto; padding: 0 var(--gutter); }

.bar { position: sticky; top: 0; z-index: 20; background: var(--linen); border-bottom: 1px solid var(--line); }
.bar-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 72px; }
.nav { display: flex; gap: 26px; }
.nav a { font-size: 14px; font-weight: 500; text-decoration: none; padding: 10px 0; }
.nav a:hover { text-decoration: underline; text-decoration-color: var(--gold); }
.wordmark { text-decoration: none; display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.wordmark { --logo-gold: #957148; --logo-ink: #6E4F2C; }
.wordmark svg { display: block; height: 34px; width: auto; }
.logo-stack { display: block; width: 180px; --logo-gold: #957148; --logo-ink: #6E4F2C; }
.logo-stack svg { display: block; width: 100%; height: auto; }
.tools { display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
.langs { display: flex; gap: 2px; }
.langs button { border: 0; background: none; padding: 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; cursor: pointer; color: var(--ink-soft); }
.langs button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 6px; }
.langs button:disabled { cursor: not-allowed; opacity: 0.55; }
.bag { position: relative; display: grid; place-items: center; width: 44px; height: 44px; text-decoration: none; }
.bag .cnt { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 4px; background: var(--ink); color: var(--linen); font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; }
.mnav { display: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 0 28px; background: var(--ink); color: var(--linen); border: 1px solid var(--ink); border-radius: 2px; text-decoration: none; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; cursor: pointer; transition: background .3s var(--ease), color .3s var(--ease); }
.btn:hover { background: var(--bronze); border-color: var(--bronze); }
.btn.light { background: var(--linen); color: var(--ink); border-color: var(--linen); }
.btn.light:hover { background: #FFFFFF; border-color: #FFFFFF; }
.btn.small { min-height: 40px; padding: 0 16px; font-size: 13px; }
.txt { border: 0; background: none; padding: 6px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }

/* hero */
.hero { position: relative; height: clamp(560px, calc(100svh - 72px), 900px); overflow: hidden; color: #FBF7F1; background: #B9AA96; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: breathe 2.2s var(--ease) both; }
@keyframes breathe { from { transform: scale(1.04); } to { transform: none; } }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(35, 27, 19, 0.62), rgba(35, 27, 19, 0) 55%); }
.hero-in { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding-bottom: clamp(28px, 4vw, 56px); }
.hero h1 { font-weight: 200; font-size: clamp(56px, 8.4vw, 136px); line-height: 0.95; max-width: 9.5ch; }
.hero p { margin-top: 18px; font-size: 17px; max-width: 40ch; color: #F1E9DD; }
.hero .btn { flex: none; }

.sec { padding: clamp(72px, 8vw, 120px) 0 0; }
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 28px; }
.sec-head h2 { font-size: clamp(38px, 4.4vw, 64px); }
.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.cat { text-decoration: none; }
.cat .ph { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--oat); }
.cat .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
.cat:hover .ph img { transform: scale(1.04); }
.cat > span { display: block; margin-top: 12px; font-family: var(--display); font-size: 28px; font-weight: 300; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { min-height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 2px; background: transparent; cursor: pointer; font-size: 14px; font-weight: 500; }
.tabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--linen); }
.note-row { margin: -12px 0 22px; color: var(--ink-soft); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px 14px; }
.card .ph { position: relative; display: block; aspect-ratio: 4 / 5; overflow: hidden; background: var(--oat); }
.card .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
.card:hover .ph img { transform: scale(1.03); }
.card .ph .coll { position: absolute; right: 12px; top: 12px; background: var(--ink); color: var(--linen); font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 2px; }
.card-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 14px; }
.card h3 { font-family: var(--sans); font-size: 16px; font-weight: 600; letter-spacing: 0; }
.card h3 a { text-decoration: none; }
.card .from { font-size: 15px; }
.card .sub { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }
.card .pick { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; }
.sw { display: flex; gap: 8px; }
.sw button { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 1px solid rgba(51, 41, 31, 0.22); background-size: cover; cursor: pointer; transition: box-shadow .25s var(--ease); }
.sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--linen), 0 0 0 3.5px var(--gold); }
.card .fab-name { margin-top: 12px; font-size: 14px; color: var(--ink-soft); }
.card .fab-name b { font-weight: 500; color: var(--ink); }
.card .fab-name.flash b { display: inline-block; animation: ink .6s var(--ease); }
@keyframes ink { from { opacity: 0; filter: blur(3px); transform: translateY(3px); } to { opacity: 1; filter: none; transform: none; } }
.card .ph img.alt { position: absolute; inset: 0; opacity: 0; transition: opacity .5s var(--ease), transform 1.2s var(--ease); }
.card:hover .ph img.alt, .card:focus-within .ph img.alt { opacity: 1; }
.card .pick { margin-top: 8px; }
.empty-row { padding: 40px 0; color: var(--ink-soft); }

.materials { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: clamp(28px, 5vw, 80px); align-items: center; }
.materials .ph { position: relative; aspect-ratio: 5 / 6; overflow: hidden; }
.materials .ph img { width: 100%; height: 100%; object-fit: cover; }
.materials h2 { font-size: clamp(38px, 4.4vw, 64px); }
.materials > div > p { margin-top: 18px; color: var(--ink-soft); max-width: 44ch; font-size: 17px; }
.fabric-list { list-style: none; margin: 28px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.fabric-list li { display: flex; align-items: center; gap: 14px; }
.fabric-list img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
.fabric-list b { display: block; font-weight: 600; }
.fabric-list span { font-size: 14px; color: var(--ink-soft); }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.how div { border-top: 1px solid var(--ink); padding: 22px 28px 0 0; }
.how b { display: block; font-family: var(--display); font-weight: 300; font-size: 30px; line-height: 1.1; }
.how p { margin-top: 12px; color: var(--ink-soft); }
.faq details { border-top: 1px solid var(--line); }
.faq details:last-child { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 0; font-size: 18px; font-weight: 500; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary svg { flex: none; transition: transform .3s var(--ease); }
.faq details[open] summary svg { transform: rotate(45deg); }
.faq p { padding: 0 0 22px; max-width: 64ch; color: var(--ink-soft); }
.added { position: fixed; z-index: 30; right: 20px; bottom: 20px; background: var(--ink); color: var(--linen); padding: 14px 18px; border-radius: 2px; display: flex; gap: 16px; align-items: center; font-size: 14px; box-shadow: 0 16px 36px -18px rgba(35, 27, 19, 0.7); animation: rise .45s var(--ease); }
.added a { font-weight: 600; color: #E7CFA4; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.foot { background: var(--oat); margin-top: clamp(80px, 10vw, 140px); padding: 60px 0 28px; font-size: 15px; }
.foot-in { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 32px; }
.foot p.lead { margin-top: 18px; max-width: 40ch; color: var(--ink-soft); }
.foot h4 { margin: 0 0 14px; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
.foot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.foot .legal { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-soft); }

/* product page */
.crumb { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin-top: 16px; text-decoration: none; font-size: 14px; font-weight: 500; }
.pdp { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: clamp(28px, 4vw, 64px); margin-top: 12px; align-items: start; }
.main-img { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--oat); }
.main-img img { width: 100%; height: 100%; object-fit: cover; }
.mine { position: absolute; left: 12px; bottom: 12px; margin: 0; display: flex; align-items: center; gap: 12px; max-width: calc(100% - 24px); padding: 8px 18px 8px 8px; border-radius: 2px; background: var(--linen); box-shadow: 0 10px 28px rgba(51, 41, 31, 0.14); }
.km-pair { position: relative; display: block; flex: none; width: var(--pair); height: var(--pair); }
.km-pair img { position: absolute; display: block; object-fit: cover; border-radius: 50%; }
.km-pair .km-shell { left: 0; top: 0; width: 80%; height: 80%; }
.km-pair .km-pad { right: 0; bottom: 0; width: 58%; height: 58%; box-shadow: 0 0 0 3px var(--linen); }
.mine .km-pair { --pair: 60px; }
.mine figcaption { display: grid; grid-template-columns: auto auto; gap: 2px 12px; align-items: baseline; font-size: 14px; line-height: 1.4; color: var(--ink); }
.mine figcaption span { font-size: 12px; color: var(--ink-soft); }
.thumbs { display: flex; gap: 10px; margin-top: 10px; }
.thumbs button { width: 84px; aspect-ratio: 4 / 5; padding: 0; border: 0; background: none; cursor: pointer; opacity: 0.65; transition: opacity .2s var(--ease); }
.thumbs button[aria-current="true"] { opacity: 1; box-shadow: 0 2px 0 var(--ink); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.side { position: sticky; top: 96px; }
.side h1 { font-size: clamp(40px, 3.6vw, 56px); }
.side .sub { margin-top: 8px; color: var(--ink-soft); }
.side .price { margin-top: 18px; font-size: 22px; font-weight: 500; }
.side .final { font-size: 14px; color: var(--ink-soft); }
.side .blurb { margin-top: 16px; color: var(--ink-soft); }
.lbl { margin-top: 26px; font-size: 14px; font-weight: 600; }
.lbl span { font-weight: 400; color: var(--ink-soft); }
.side .sw { margin-top: 12px; gap: 12px; }
.side .sw button { width: 40px; height: 40px; }
.sizes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.sz { display: grid; gap: 2px; min-height: 64px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 2px; background: transparent; cursor: pointer; text-align: left; transition: border-color .2s var(--ease); }
.sz:hover { border-color: var(--ink-soft); }
.sz[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.sz b { font-weight: 600; display: flex; justify-content: space-between; }
.sz span { font-size: 13px; color: var(--ink-soft); }
.buy { display: flex; gap: 10px; margin-top: 22px; }
.buy .btn { flex: 1; }
.qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 2px; }
.qty button { width: 44px; height: 48px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.qty span { min-width: 22px; text-align: center; }
.cod { margin-top: 16px; padding: 16px 18px; background: var(--oat); border-radius: 2px; display: grid; grid-template-columns: 24px 1fr; gap: 12px; font-size: 15px; }

/* cart, checkout, done */
.page-title { font-size: clamp(44px, 5vw, 72px); margin: 36px 0 28px; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: clamp(28px, 4vw, 60px); align-items: start; }
.item { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 18px; padding: 20px 0; border-top: 1px solid var(--line); align-items: start; }
.item > img { width: 110px; aspect-ratio: 4 / 5; height: auto; object-fit: cover; }
.item h3 { font-family: var(--sans); font-size: 16px; font-weight: 600; }
.item .meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; color: var(--ink-soft); font-size: 14px; }
.item .meta img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
.item .ctl { display: flex; gap: 16px; align-items: center; margin-top: 12px; }
.item .ctl .qty button { height: 40px; width: 40px; }
.item .sum { font-weight: 500; }
.sumbox { background: var(--oat); padding: 26px; border-radius: 2px; position: sticky; top: 96px; }
.sumbox .row { display: flex; justify-content: space-between; padding: 5px 0; }
.sumbox .total { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--line); font-weight: 600; font-size: 18px; }
.sumbox .muted { font-size: 14px; color: var(--ink-soft); margin-top: 6px; }
.sumbox .btn { width: 100%; margin-top: 18px; }
.progress { height: 3px; border-radius: 2px; background: var(--line); margin-top: 10px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--gold); }
.empty h2 { font-size: 36px; margin-bottom: 24px; }
.form h2 { font-size: 34px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.f { display: block; margin-top: 16px; font-size: 14px; font-weight: 600; }
.f input, .f textarea { display: block; width: 100%; margin-top: 6px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 2px; background: #FBF8F3; font: 16px var(--sans); color: var(--ink); }
.f input:focus, .f textarea:focus { outline: none; border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.f small { display: block; margin-top: 5px; font-size: 13px; font-weight: 400; color: var(--ink-soft); }
.f .err { display: none; color: #9A3A22; }
.was-validated .f input:invalid { border-color: #9A3A22; }
.was-validated .f input:invalid ~ .err { display: block; }
.form .cod { margin-top: 22px; }
.form .btn { width: 100%; margin-top: 20px; }
.done { max-width: 760px; padding-top: 48px; }
.done h1 { font-size: clamp(56px, 7vw, 104px); font-weight: 200; }
.done > p { margin-top: 16px; font-size: 18px; color: var(--ink-soft); }
.done .how { margin-top: 36px; grid-template-columns: 1fr; }
.done .btn { margin-top: 32px; }

@media (max-width: 1000px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pdp, .two-col, .materials { grid-template-columns: 1fr; }
  .side, .sumbox { position: static; }
}
@media (max-width: 760px) {
  .bar-in { grid-template-columns: auto 1fr; height: 62px; }
  .nav { display: none; }
  .wordmark { align-items: flex-start; }
  .wordmark svg { height: 26px; }
  .langs button:disabled { display: none; }
  .mnav { display: flex; gap: 6px; padding: 0 var(--gutter) 10px; }
  .mnav a { flex: 1 1 auto; text-align: center; white-space: nowrap; text-decoration: none; padding: 8px 6px; border: 1px solid var(--line); border-radius: 2px; font-size: clamp(12px, 3.6vw, 14px); font-weight: 500; }
  .hero { height: calc(100svh - 112px); min-height: 520px; }
  .hero-in { flex-direction: column; align-items: flex-start; }
  .hero .btn { width: 100%; }
  .cats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .cat > span { font-size: 20px; }
  .card .ph .coll { top: auto; bottom: 10px; right: 10px; }
  .grid { gap: 32px 10px; }
  .card .pick { flex-direction: column; align-items: flex-start; }
  .card .pick .btn { width: 100%; }
  .card-row { flex-direction: column; gap: 0; }
  .how { grid-template-columns: 1fr; }
  .fabric-list { grid-template-columns: 1fr; }
  .foot-in { grid-template-columns: 1fr 1fr; }
  .foot-in > div:first-child { grid-column: 1 / -1; }
  .item { grid-template-columns: 84px minmax(0, 1fr); }
  .item > img { width: 84px; }
  .item .sum { grid-column: 2; }
  .pair { grid-template-columns: 1fr; gap: 0; }
  .buy .btn .s { display: none; }
  .added { left: 16px; right: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
/* Testimonials: one card, three shapes (photo, words, both) */
:root { --t-band: var(--oat); --t-card: var(--linen); --t-ink: var(--ink); --t-radius: 2px; --t-photo: var(--line); --t-quote: var(--display); --t-quote-weight: 300; --t-quote-size: 21px; --t-quote-big: 29px; --t-quote-track: -0.005em; --t-cap: var(--ink-soft); --t-gap: 18px; --t-chip: rgba(246, 241, 234, 0.6); --t-chip-hover: var(--linen); --t-chip-on: var(--ink); --t-chip-on-ink: var(--linen); --t-chip-radius: 2px; }
.voices { background: var(--t-band); margin-top: clamp(72px, 8vw, 120px); padding: clamp(64px, 8vw, 112px) 0; }
.voices-head { display: flex; justify-content: space-between; align-items: end; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 36px; }
.voices-head h2 { font-size: clamp(38px, 4.4vw, 64px); }
.voices-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.km-row-toggle svg { flex: none; }
.km-t { margin: 0; width: 300px; flex: none; display: flex; flex-direction: column; background: var(--t-card); border-radius: var(--t-radius); overflow: hidden; color: var(--t-ink); }
.km-t-photo { display: block; aspect-ratio: 1; background: var(--t-photo); overflow: hidden; }
.km-t-photo img { width: 100%; height: 100%; object-fit: cover; }
.km-t-words { margin: 0; padding: 26px 24px 0; font-family: var(--t-quote); font-weight: var(--t-quote-weight); font-size: var(--t-quote-size); line-height: 1.32; letter-spacing: var(--t-quote-track); }
.km-t-photo + .km-t-words { padding-top: 18px; }
.km-t-words p { text-wrap: pretty; }
.km-t-cap { margin-top: auto; padding: 16px 24px 20px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; }
.km-t-pet { font-weight: 600; }
.km-t-prod { margin-left: auto; color: var(--t-cap); text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); }
.km-t-prod:hover { color: var(--t-ink); text-decoration-color: currentColor; }
.km-t--photo .km-t-photo { flex: 1; aspect-ratio: auto; min-height: 300px; }
.km-t--words .km-t-words { flex: 1; font-size: var(--t-quote-big); line-height: 1.22; padding-top: 30px; }
.km-row { overflow: hidden; padding: 4px 0; }
.km-row-track { display: flex; width: max-content; animation: km-row var(--km-row-dur, 120s) linear infinite; }
.km-row-set { display: flex; align-items: stretch; gap: var(--t-gap); padding-right: var(--t-gap); }
.km-row:hover .km-row-track, .km-row:focus-within .km-row-track, .km-row.paused .km-row-track { animation-play-state: paused; }
@keyframes km-row { to { transform: translate3d(-50%, 0, 0); } }

/* Vaši utisci page and a Product's own Testimonials */
.t-page { display: flow-root; background: var(--t-band); padding: 0 0 clamp(56px, 7vw, 96px); }
.t-lead { max-width: 52ch; font-size: 18px; color: var(--t-cap); }
.t-filter { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 32px; }
.t-filter a { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--t-chip-radius); background: var(--t-chip); text-decoration: none; transition: background .2s var(--ease), color .2s var(--ease); }
.t-filter a:hover { background: var(--t-chip-hover); }
.t-filter a[aria-current="page"] { background: var(--t-chip-on); color: var(--t-chip-on-ink); }
.t-filter a span { font-size: 13px; opacity: 0.72; }
.t-for { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin: -8px 0 28px; padding: 14px 14px 14px 20px; background: var(--t-card); border-radius: var(--t-radius); }
.t-for b { font-family: var(--t-quote); font-weight: var(--t-quote-weight); font-size: 22px; }
.t-for span { color: var(--t-cap); }
.t-wall { columns: 3 280px; column-gap: var(--t-gap); }
.t-wall .km-t { width: auto; break-inside: avoid; margin-bottom: var(--t-gap); }
.t-wall .km-t--photo .km-t-photo { flex: none; aspect-ratio: 4 / 5; min-height: 0; }
.pdp-voices { background: var(--t-band); padding: clamp(48px, 6vw, 80px) 0; }
.pdp-voices .voices-head { margin-bottom: 28px; }
.t-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--t-gap); align-items: stretch; }
.t-grid .km-t { width: auto; }
.km-t-words { line-height: 1.26; }
.km-t-pet { font-weight: 600; color: var(--bronze); }
.t-filter a { font-size: 15px; font-weight: 500; }
.km-row-toggle { gap: 8px; }
@media (max-width: 1000px) {
  .t-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .km-t { width: 260px; }
  .km-t--words .km-t-words { font-size: calc(var(--t-quote-big) - 3px); }
  .t-grid { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: var(--gutter); margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter) 4px; scrollbar-width: none; }
  .t-grid .km-t { width: 78%; scroll-snap-align: start; }
}
@media (prefers-reduced-motion: reduce) {
  .km-row { overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: var(--gutter); padding: 4px var(--gutter); }
  .km-row-track { animation: none !important; }
  .km-row-set[aria-hidden] { display: none; }
  .km-row .km-t { scroll-snap-align: start; }
  .km-row-toggle { display: none; }
}

<body>
<div id="app"></div>
<script src="logo.js"></script>
<script src="shop.js"></script>
<script>
(function () {
  var I = {
    bag: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 8h13l-1.1 12.2a1 1 0 0 1-1 .8H7.6a1 1 0 0 1-1-.8L5.5 8Z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>',
    plus: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    minus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>',
    left: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
    cash: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6.5" width="19" height="11" rx="1.5"/><circle cx="12" cy="12" r="2.6"/></svg>'
  };
  var ui = { added: null, flash: null };
  function pickOf(p) {
    var pk = KM.state.pick[p.id];
    return pk || { pad: p.pad, shell: p.shell, size: p.sizes[Math.min(1, p.sizes.length - 1)].id, qty: 1, view: 0 };
  }

  function header(c) {
    var links = '<a href="#/proizvodi" data-act="browse">Krevetići</a><a href="#/proizvodi" data-act="browse" data-coll="Poznato. Ali novo.">Kolekcija</a><a href="#/tkanine">Tkanine</a><a href="#/utisci">Vaši utisci</a>';
    return '<header class="bar"><div class="wrap bar-in"><nav class="nav" aria-label="Glavni meni">' + links + '</nav>' +
      '<a class="wordmark" href="#/" aria-label="KettyMon, početna">' + KM_LOGO.row + '</a>' +
      '<div class="tools"><div class="langs" role="group" aria-label="Jezik"><button type="button" aria-pressed="true" title="Srpski">SR</button><button type="button" disabled title="U pripremi">EN</button><button type="button" disabled title="U pripremi">RU</button></div>' +
      '<a class="bag" href="#/korpa" aria-label="Korpa, ' + c.cart.count + ' proizvoda">' + I.bag + (c.cart.count ? '<span class="cnt">' + c.cart.count + '</span>' : '') + '</a></div></div>' +
      '<nav class="mnav" aria-label="Kategorije">' + links + '</nav></header>';
  }

  function card(c, p) {
    var pk = pickOf(p), f = c.fabrics[pk.shell];
    return '<article class="card"><a class="ph" href="#/p/' + p.id + '" tabindex="-1" aria-hidden="true"><img src="' + p.photos[0] + '" alt="" loading="lazy">' + (p.photos[1] ? '<img class="alt" src="' + p.photos[1] + '" alt="" loading="lazy">' : '') + (p.isNew ? '<span class="coll">Novo</span>' : '') + '</a>' +
      '<div class="card-row"><h3><a href="#/p/' + p.id + '">' + p.name + '</a></h3><span class="from">' + p.from + '</span></div><p class="sub">' + p.kind + ' · ' + p.sizeLabel + '</p>' +
      '<p class="fab-name' + (ui.flash === p.id ? ' flash' : '') + '">Spoljni deo · <b>' + f.name + '</b></p><div class="pick"><div class="sw" role="group" aria-label="Tkanina spoljnog dela, ' + p.name + '">' + c.fabricIds.filter(function (k) { return c.fabrics[k].shell; }).map(function (k) { return '<button type="button" data-act="cfab" data-pid="' + p.id + '" data-fabric="' + k + '" aria-pressed="' + (k === pk.shell) + '" aria-label="' + c.fabrics[k].name + '" style="background-image:url(' + c.fabrics[k].img + ')"></button>'; }).join('') + '</div>' +
      '<button type="button" class="btn small" data-act="quick" data-pid="' + p.id + '">Dodaj · ' + pk.size + '</button></div></article>';
  }

  function home(c) {
    var s = c.state;
    var tabs = [['', 'Svi'], [c.collection, 'Kolekcija']].map(function (t) { return '<button type="button" data-act="coll" data-coll="' + t[0] + '" aria-pressed="' + (s.coll === t[0]) + '">' + t[1] + '</button>'; }).join('');
    return '<section class="hero"><img src="img/dog-blanket-close.webp" alt="Pas ušuškan u ćebe" fetchpriority="high">' +
      '<div class="wrap hero-in"><div><h1>Za najlepši san u kući</h1><p>Krevetići za pse i mačke, šiveni ručno u Srbiji. Plaćate kuriru kada paket stigne.</p></div><a class="btn light" href="#/proizvodi">Izaberi krevetić</a></div></section>' +
      '<section class="sec"><div class="wrap"><div class="sec-head"><h2>Šta tražite?</h2></div><div class="cats">' +
      '<a class="cat" href="#/proizvodi" data-act="browse"><div class="ph"><img src="img/bed-oval-room.webp" alt="" loading="lazy"></div><span>Svi krevetići</span></a>' +
      '<a class="cat" href="#/tkanine"><div class="ph"><img src="img/room-wide-saluki.webp" alt="" loading="lazy"></div><span>Tkanine</span></a>' +
      '<a class="cat" href="#/proizvodi" data-act="browse" data-coll="Poznato. Ali novo."><div class="ph"><img src="img/cat-pink-cushion.webp" alt="" loading="lazy"></div><span>Poznato. Ali novo.</span></a></div></div></section>' +
      '<section class="sec" id="proizvodi"><div class="wrap"><div class="sec-head"><h2>Naši modeli</h2><div class="tabs" role="group" aria-label="Kolekcija">' + tabs + '</div></div>' +
      (c.filterNote ? '<p class="note-row">' + c.filterNote + ' · <button type="button" class="txt" data-act="browse">Prikaži sve</button></p>' : '') +
      (c.products.length ? '<div class="grid">' + c.products.map(function (p) { return card(c, p); }).join('') + '</div>' : '<p class="empty-row">Nema modela u ovom izboru.</p>') + '</div></section>' +
      '<section class="sec" id="tkanine"><div class="wrap materials"><div class="ph"><img src="img/cat-round-sherpa.webp" alt="Mačka u okruglom krevetiću" loading="lazy"></div>' +
      '<div><h2>Tkanine koje birate</h2><p>Svaki krevetić ima jastuk i spoljni deo. Za svaki deo birate tkaninu, može i istu za oba, a cena zavisi samo od veličine.</p><ul class="fabric-list">' +
      c.fabricIds.map(function (k) { var f = c.fabrics[k]; return '<li><img src="' + f.img + '" alt=""><div><b>' + f.name + '</b><span>' + (f.pad && f.shell ? 'Za jastuk i spoljni deo' : f.pad ? 'Samo za jastuk' : 'Samo za spoljni deo') + '</span></div></li>'; }).join('') + '</ul></div></div></section>' +
      '<section class="sec"><div class="wrap"><div class="sec-head"><h2>Kako kupujete</h2></div><div class="how">' +
      '<div><b>Poručite na sajtu</b><p>Bez registracije i bez kartice. Dovoljni su adresa i telefon.</p></div>' +
      '<div><b>Zovemo vas</b><p>Potvrdimo porudžbinu telefonom. ' + c.delivery + '.</p></div>' +
      '<div><b>Plaćate kuriru</b><p>Gotovinom, kada paket stigne. Povrat u roku od 14 dana.</p></div></div></div></section>' +
      '<section class="voices" id="utisci" aria-labelledby="utisci-h"><div class="wrap voices-head"><h2 id="utisci-h">Vaši utisci</h2><div class="voices-tools">' + c.trowToggle('btn light km-row-toggle') + '<a class="btn" href="#/utisci">Svi utisci</a></div></div>' +
      c.trow(c.testimonials, 'Vaši utisci') + '</section>' +
      '<section class="sec" id="pitanja"><div class="wrap"><div class="sec-head"><h2>Pitanja</h2></div><div class="faq">' +
      '<details><summary>Kako da izaberem veličinu? ' + I.plus + '</summary><p>Uz svaku veličinu piše za koliko kilograma je namenjena. Ako vaš ljubimac voli da se ispruži, uzmite jednu veličinu veću.</p></details>' +
      '<details><summary>Koliko košta dostava? ' + I.plus + '</summary><p>Dostava košta ' + c.fee + ', a za porudžbine od ' + c.freeFrom + ' je besplatna.</p></details>' +
      '<details><summary>Kako plaćam? ' + I.plus + '</summary><p>Pouzećem: gotovinom kuriru kada paket stigne. Pre slanja vas zovemo da potvrdimo porudžbinu.</p></details>' +
      '<details><summary>Mogu li da vratim krevetić? ' + I.plus + '</summary><p>Da, u roku od 14 dana od preuzimanja. Troškove povratne dostave plaćate vi.</p></details></div></div></section>';
  }

  function sw(part, label, cur, opts) {
    return '<p class="lbl">' + label + ' <span>· ' + cur.name + '</span></p><div class="sw" role="group" aria-label="Tkanina, ' + label.toLowerCase() + '">' + opts.map(function (f) { return '<button type="button" data-act="' + part + '" data-fabric="' + f.id + '" aria-pressed="' + f.on + '" aria-label="' + f.name + '" style="background-image:url(' + f.img + ')"></button>'; }).join('') + '</div>';
  }

  function product(c) {
    var v = c.pv, p = v.p, pk = v.pick, g = v.gallery[v.view];
    return '<div class="wrap"><a class="crumb" href="#/proizvodi">' + I.left + 'Svi modeli</a><div class="pdp"><div><div class="main-img"><img src="' + g.src + '" alt="' + g.alt + '">' +
      '<figure class="mine" aria-live="polite">' + v.pair + '<figcaption><span>Jastuk</span>' + v.pad.name + '<span>Spoljni deo</span>' + v.shell.name + '</figcaption></figure></div>' +
      '<div class="thumbs">' + v.gallery.map(function (t, i) { return '<button type="button" data-act="view" data-view="' + i + '" aria-current="' + (i === v.view) + '" aria-label="Slika ' + (i + 1) + '"><img src="' + t.src + '" alt=""></button>'; }).join('') + '</div></div>' +
      '<div class="side"><h1>' + p.name + '</h1><p class="sub">' + p.kind + ' · ' + v.sizeLabel + (p.collection ? ' · Kolekcija ' + p.collection : '') + '</p>' +
      '<p class="price">' + v.price + '</p><p class="final">Cene su konačne. Cena zavisi samo od veličine.</p><p class="blurb">' + p.blurb + '</p>' +
      sw('pad', 'Jastuk', v.pad, v.padOptions) + sw('shell', 'Spoljni deo', v.shell, v.shellOptions) +
      '<p class="lbl">Veličina <span>· prema težini ljubimca</span></p><div class="sizes">' + p.sizes.map(function (z) { return '<button type="button" class="sz" data-act="size" data-size="' + z.id + '" aria-pressed="' + (z.id === v.size.id) + '"><b>' + z.id + '<span>' + KM.fmt(z.price) + '</span></b><span>' + z.dims + ' · ' + z.pet + '</span></button>'; }).join('') + '</div>' +
      '<div class="buy"><div class="qty"><button type="button" data-act="qty" data-d="-1" aria-label="Smanji količinu">' + I.minus + '</button><span aria-live="polite">' + pk.qty + '</span><button type="button" data-act="qty" data-d="1" aria-label="Povećaj količinu">' + I.plus + '</button></div><button type="button" class="btn" data-act="add">Dodaj u korpu<span class="s">&nbsp;· ' + v.addTotal + '</span></button></div>' +
      '<div class="cod">' + I.cash + '<p>Plaćanje pouzećem. Zovemo vas da potvrdimo porudžbinu, ' + c.delivery.toLowerCase() + ', a plaćate kuriru.</p></div></div></div></div>' +
      pdpVoices(c, v);
  }

  function pdpVoices(c, v) {
    var list = v.testimonials;
    if (!list.length) return '';
    return '<section class="pdp-voices" aria-labelledby="pv-h"><div class="wrap"><div class="voices-head"><h2 id="pv-h">Utisci o krevetiću ' + v.p.name + '</h2>' +
      '<a class="btn" href="#/utisci/' + v.p.id + '">Svi utisci o krevetiću (' + list.length + ')</a></div>' +
      '<div class="t-grid">' + list.slice(0, 4).map(function (t) { return c.tcard(t, { product: false }); }).join('') + '</div></div></section>';
  }

  function utisci(c) {
    var tp = c.tp, p = tp.product;
    return '<div class="t-page"><div class="wrap"><h1 class="page-title">Vaši utisci</h1><p class="t-lead">Fotografije i poruke koje ste nam slali na Instagramu, svaka o krevetiću koji smo sašili baš za vašeg ljubimca.</p>' +
      '<nav class="t-filter" aria-label="Utisci po krevetiću">' + tp.filters.map(function (f) { return '<a href="' + f.href + '"' + (f.on ? ' aria-current="page"' : '') + '>' + f.label + ' <span>' + f.count + '</span></a>'; }).join('') + '</nav>' +
      (p ? '<div class="t-for"><p><b>' + p.name + '</b> <span>' + p.kind + ' · od ' + KM.fmt(p.sizes[0].price) + '</span></p><a class="btn" href="#/p/' + p.id + '">Pogledaj krevetić</a></div>' : '') +
      '<div class="t-wall">' + tp.list.map(function (t) { return c.tcard(t, { product: !p }); }).join('') + '</div></div></div>';
  }

  function sumbox(c, action) {
    var k = c.cart;
    return '<aside class="sumbox" aria-label="Pregled porudžbine"><div class="row"><span>Međuzbir</span><span>' + k.subtotal + '</span></div><div class="row"><span>Dostava</span><span>' + k.shipping + '</span></div>' +
      (k.freeLeft ? '<div class="progress" aria-hidden="true"><i style="width:' + k.freeProgress + '%"></i></div><p class="muted">Još ' + k.freeLeft + ' do besplatne dostave.</p>' : '') +
      '<div class="row total"><span>Ukupno</span><span>' + k.total + '</span></div><p class="muted">Cene su konačne. Plaćate kuriru.</p>' + action + '</aside>';
  }

  function cart(c) {
    var k = c.cart;
    if (k.empty) return '<div class="wrap"><h1 class="page-title">Korpa</h1><div class="empty"><h2>Korpa je prazna.</h2><a class="btn" href="#/proizvodi">Pogledaj modele</a></div></div>';
    return '<div class="wrap"><h1 class="page-title">Korpa</h1><div class="two-col"><div>' + k.lines.map(function (l) {
      return '<div class="item"><img src="' + l.product.photos[0] + '" alt=""><div><h3>' + l.product.name + '</h3><p class="meta">' + l.product.kind + ' · ' + l.size.id + ', ' + l.size.dims + '</p><p class="meta"><img src="' + l.pad.img + '" alt=""><img src="' + l.shell.img + '" alt="">' + l.fabricText + '</p><div class="ctl"><div class="qty"><button type="button" data-act="line" data-i="' + l.index + '" data-d="-1" aria-label="Smanji količinu">' + I.minus + '</button><span>' + l.qty + '</span><button type="button" data-act="line" data-i="' + l.index + '" data-d="1" aria-label="Povećaj količinu">' + I.plus + '</button></div><button type="button" class="txt" data-act="remove" data-i="' + l.index + '">Ukloni</button></div></div><p class="sum">' + l.total + '</p></div>';
    }).join('') + '</div>' + sumbox(c, '<a class="btn" href="#/porucivanje">Završi kupovinu</a>') + '</div></div>';
  }

  function f(name, label, type, extra, help) {
    return '<label class="f">' + label + '<input name="' + name + '" type="' + type + '" required ' + (extra || '') + '>' + (help ? '<small>' + help + '</small>' : '') + '<small class="err">Popunite ovo polje.</small></label>';
  }

  function checkout(c) {
    return '<div class="wrap"><h1 class="page-title">Poručivanje</h1><div class="two-col"><form class="form" data-form="order" novalidate><h2>Gde da pošaljemo?</h2>' +
      '<div class="pair">' + f('ime', 'Ime', 'text', 'autocomplete="given-name"') + f('prezime', 'Prezime', 'text', 'autocomplete="family-name"') + '</div>' + f('ulica', 'Ulica i broj', 'text', 'autocomplete="street-address"') +
      '<div class="pair">' + f('grad', 'Grad', 'text', 'autocomplete="address-level2"') + f('postanski', 'Poštanski broj', 'text', 'inputmode="numeric" pattern="[0-9]{5}" autocomplete="postal-code"') + '</div>' +
      f('telefon', 'Telefon', 'tel', 'autocomplete="tel"', 'Zovemo vas da potvrdimo porudžbinu.') + f('email', 'Email', 'email', 'autocomplete="email"', 'Ovde stiže potvrda.') +
      '<label class="f">Napomena (opciono)<textarea name="napomena" rows="3"></textarea></label>' +
      '<div class="cod">' + I.cash + '<p>Plaćanje pouzećem: gotovinom kuriru pri preuzimanju paketa.</p></div>' +
      '<button class="btn" type="submit">Poruči · ' + c.cart.total + '</button></form>' + sumbox(c, '') + '</div></div>';
  }

  function done(c) {
    var o = c.order || { number: 'KM-1042' };
    return '<div class="wrap"><div class="done"><h1>Hvala vam!</h1><p>Primili smo vašu porudžbinu <b>' + o.number + '</b>.</p><div class="how">' +
      '<div><b>Uskoro vas zovemo</b><p>Zovemo vas' + (o.phone ? ' na ' + c.esc(o.phone) : '') + ' da potvrdimo porudžbinu.</p></div>' +
      '<div><b>Šijemo i šaljemo</b><p>' + c.delivery + '.</p></div><div><b>Plaćate kuriru</b><p>Gotovinom, kada paket stigne.</p></div></div><a class="btn" href="#/">Nazad na početnu</a></div></div>';
  }

  function footer(c) {
    return '<footer class="foot"><div class="wrap"><div class="foot-in"><div><span class="logo-stack">' + KM_LOGO.stack + '</span><p class="lead">Ručno šiveni krevetići za pse i mačke. Prototip: fotografije, utisci, nazivi modela i tkanina, cene, cena dostave i rok dostave su privremeni primeri.</p></div>' +
      '<div><h4>Kupovina</h4><ul><li><a href="#">Dostava i plaćanje</a></li><li><a href="#">Povrat u roku od 14 dana</a></li><li><a href="#">Uslovi kupovine</a></li><li><a href="#">Politika privatnosti</a></li></ul></div>' +
      '<div><h4>Kontakt</h4><ul><li>[Telefon]</li><li>[Email]</li><li><a href="https://www.instagram.com/ketty.mon/">Instagram</a> · <a href="#">Viber</a> · <a href="#">WhatsApp</a></li></ul></div></div>' +
      '<p class="legal">© KettyMon · Prodavac: ' + c.seller + ' · Nije u sistemu PDV-a · Cene su konačne.</p></div></footer>';
  }

  function keep(render, focusSel) {
    var x = window.scrollX, y = window.scrollY;
    render(); window.scrollTo(x, y);
    var b = focusSel && document.querySelector(focusSel); if (b) b.focus({ preventScroll: true });
  }

  function act(a, el, ev, state, render) {
    var p = KM.find(el.getAttribute('data-pid'));
    if (a === 'cfab') {
      var pk = pickOf(p);
      state.pick[p.id] = { pad: pk.pad, shell: el.getAttribute('data-fabric'), size: pk.size, qty: 1, view: 0 };
      ui.flash = p.id;
      keep(render, '[data-act="cfab"][data-pid="' + p.id + '"][aria-pressed="true"]');
    }
    if (a === 'quick') {
      var q = pickOf(p);
      var found = state.cart.filter(function (l) { return l.pid === p.id && l.pad === q.pad && l.shell === q.shell && l.size === q.size; })[0];
      if (found) found.qty = Math.min(9, found.qty + 1); else state.cart.push({ pid: p.id, pad: q.pad, shell: q.shell, size: q.size, qty: 1 });
      try { sessionStorage.setItem('km-cart', JSON.stringify(state.cart)); } catch (e) { /* storage unavailable */ }
      ui.added = p.name + ', ' + q.size + ', jastuk ' + KM.fabrics[q.pad].name.toLowerCase() + ', spoljni deo ' + KM.fabrics[q.shell].name.toLowerCase();
      keep(render, '[data-act="quick"][data-pid="' + p.id + '"]');
    }
  }

  function after(c, root) {
    ui.flash = null;
    if (!ui.added) return;
    var t = document.createElement('div');
    t.className = 'added'; t.setAttribute('role', 'status');
    t.innerHTML = '<span>Dodato: ' + ui.added + '</span><a href="#/korpa">Korpa</a>';
    root.appendChild(t); ui.added = null;
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 4000);
  }

  KM.mount({ utisci: utisci, header: header, footer: footer, home: home, product: product, cart: cart, checkout: checkout, done: done, act: act, after: after });
})();
</script>
</body>
</html>
